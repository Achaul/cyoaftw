}

function renderRoomObjectActionMenu(item) {
    const el = document.getElementById("chatOptionsEl");
    if (!el) return;

    el.innerHTML = "";
    if (!item) return;

    const buttons = [
        createCombatButton("Examine", () => examineRoomObject(item)),
        createCombatButton("Search", () => searchBodyObject(item), { disabled: item.bodyLooted === true })
    ];

    if (item.bodyState === "unconscious") {
        buttons.push(createCombatButton("Try to wake", () => wakeUnconsciousBody(item)));
        buttons.push(createCombatButton("Finish off", () => finishOffBody(item), { className: "danger" }));
    }

    buttons.push(createCombatButton("Leave", () => leaveRoomObject()));
    appendCombatGroup(el, "Body", buttons);
}

function examineRoomObject(item) {
    if (!item) return;

    const wounds = describeCombatWounds(item);
    const base = item.description || `You look over ${getEntityName(item)}.`;
    const woundText = wounds ? ` Visible wounds: ${wounds}.` : "";
    setNarration(base + woundText);
    renderRoomObjectActionMenu(item);
}

function collectBodyLoot(item) {
    const found = [];
    if (!item) return found;
    if (!Array.isArray(G.player.inventory)) G.player.inventory = [];

    const inventory = Array.isArray(item.inventory) ? item.inventory : [];
    while (inventory.length) {
        const loot = inventory.shift();
        if (loot && !loot.hidden && !loot.isHidden) {
            G.player.inventory.push({ ...loot });
            found.push(getItemName(loot));
        }
    }
    item.inventory = inventory;

    const equipped = item.equipped || {};
    Object.keys(equipped).forEach(slot => {
        if (slot === "coinPouch") return;
        const equippedItem = equipped[slot];
        if (!equippedItem) return;
        if (Array.isArray(equippedItem)) {
            equippedItem.forEach(entry => {
                if (entry) {
                    G.player.inventory.push({ ...entry });
                    found.push(getItemName(entry));
                }
            });
        } else {
            G.player.inventory.push({ ...equippedItem });
            found.push(getItemName(equippedItem));
        }
        delete equipped[slot];
    });

    const coins = getCoinValue(item);
    if (coins > 0) {
        adjustCoins(G.player, coins);
        adjustCoins(item, -coins);
        found.push(`${coins}g`);
    }

    return found;
}

function searchBodyObject(item) {
    if (!item || item.bodyLooted) return;

    const found = collectBodyLoot(item);
    item.bodyLooted = true;

    document.getElementById("npcFavorEl").textContent = "Searched";
    renderStats();
    renderRoomObjectActionMenu(item);

    const name = getEntityName(item);
    const text = found.length
        ? `You search ${name} and recover ${found.join(", ")}.`
        : `You search ${name}, but find nothing useful.`;
    setNarration(text);
    rememberStoryEvent("combat", `${G.player.name} searched ${name}.`, 3);
    saveGameState();
}

function wakeUnconsciousBody(item) {
    if (!item || item.bodyState !== "unconscious") return;

    const room = G.activeRoom || getRoom(G.player && G.player.coords);
    if (!room) return;

    room.items = Array.isArray(room.items) ? room.items : [];
    room.creatures = Array.isArray(room.creatures) ? room.creatures : [];

    const itemIndex = room.items.findIndex(entry => entry === item || (entry && item.id && entry.id === item.id));
    if (itemIndex >= 0) room.items.splice(itemIndex, 1);

    item.name = item.originalName || item.name || item.species || "wounded opponent";
    item.bodyState = null;
    item.objectType = null;
    item.isUnconsciousBody = false;
    item.unconscious = false;
    item.dead = false;
    item.hidden = false;
    item.isHidden = false;
    item.hp = Math.max(1, Math.ceil((item.hpMax || 10) * 0.25));
    item.hostility = Math.max(0, (item.hostility || 0) - 20);
    item.action = "is struggling back to their feet";
    item.description = "";

    if (item.memory) {
        item.memory.lastMood = "shaken";
        item.memory.favorability = Math.max(-80, (item.memory.favorability || 0) - 10);
    }
    if (typeof generateNPCBehavior === "function") item.behavior = generateNPCBehavior(item);

    room.creatures.push(item);
    G.activeObject = null;
    applyNPCImpact(item, {
        mood: -1,
        favor: -6,
        hostility: -20,
        intent: "mercy",
        moodOverride: "shaken",
        actionTag: "woken-after-defeat"
    });
    selectNPC(item);
    setNarration(`${item.name} wakes, battered and wary.`);
    rememberStoryEvent("combat", `${G.player.name} woke ${item.name} after combat.`, 4);
    saveGameState();
}

function finishOffBody(item) {
    if (!item || item.bodyState !== "unconscious") return;

    const originalName = item.originalName || item.name || item.species || "opponent";
    item.bodyState = "corpse";
    item.dead = true;
    item.unconscious = false;
    item.isUnconsciousBody = false;
    item.hp = 0;
    item.name = `corpse of ${originalName}`;
    item.description = `The body of ${originalName} lies still.`;
    if (Array.isArray(item.tags) && !item.tags.includes("corpse")) item.tags.push("corpse");

    selectRoomObject(item, `You finish off ${originalName}.`);
    rememberStoryEvent("combat", `${G.player.name} killed ${originalName} while they were unconscious.`, 9);
    saveGameState();
}

function leaveRoomObject() {
    const item = G.activeObject;
    G.activeObject = null;
    resetNpcPanel();
    if (item) setNarration(`You step away from ${getEntityName(item)}.`);
    saveGameState();
}

// ── NPC PANEL ────────────────────────────────────────────────────

function getNPCDispositionSummary(npc) {
    if (!npc) return "neutral";

    const relationship = typeof getRelationshipLabel === "function"
        ? getRelationshipLabel(npc)
        : "neutral";
    const attraction = typeof getAttractionLabel === "function" ? getAttractionLabel(npc) : "none";
    const favor = npc.memory && typeof npc.memory.favorability === "number"
        ? npc.memory.favorability
        : 0;
    const hostility = typeof npc.hostility === "number" ? npc.hostility : 0;

    const parts = [`${relationship} (F${favor >= 0 ? "+" : ""}${favor}, H${hostility})`];
    if (attraction && attraction !== "none") parts.push(attraction);
    return parts.join(" / ");
}

function refreshNPCDetailPanel(npc) {
    if (!npc) return;

    const detailEl = document.getElementById("npcDetailEl");
    if (!detailEl || !detailEl.classList.contains("active")) return;

    const inspection = typeof getNPCInspectionDetail === "function"
        ? getNPCInspectionDetail(npc)
        : "";

    document.getElementById("npcDetailNameEl").textContent = npc.name;
    document.getElementById("npcDetailBehaviorEl").textContent =
        [npc.behavior || "", inspection].filter(Boolean).join(" ");
    document.getElementById("npcMoodEl").textContent =
        npc.memory && npc.memory.lastMood ? npc.memory.lastMood : "neutral";
    document.getElementById("npcRoleEl").textContent = npc.role || "unknown";
    document.getElementById("npcFavorEl").textContent = getNPCDispositionSummary(npc);
}

function selectNPC(npc) {
    if (!npc) return;
    hydrateNPCSpeciesFlags(npc);

    const previousNPC = G.activeNPC;
    const isNewNPC = !previousNPC ||
        (previousNPC.id && npc.id ? previousNPC.id !== npc.id : previousNPC !== npc);
    G.activeNPC = npc;
    G.activeObject = null;
    G.activeNPCMode = "menu";

    document.getElementById("npcPlaceholderEl").style.display = "none";
    document.getElementById("npcDetailEl").classList.add("active");
    refreshNPCDetailPanel(npc);

    if (isNewNPC) {
        if (typeof resetNPCConversationSession === "function") resetNPCConversationSession(npc);
        clearChatLog();
    }
    const inspection = typeof getNPCInspectionDetail === "function"
        ? getNPCInspectionDetail(npc) : "";
    setNarration(`${npc.name} ${npc.action || "is standing nearby"}.${inspection ? "\n\n" + inspection : ""}`);
    setExitGridVisible(false);
    renderNPCActionMenu(npc);
    if (canConverseWithNPC(npc)) {
        queueConversationPrefetch(npc, getChatOptions(npc));
    }
    saveGameState();
}

// ── EQUIPMENT ────────────────────────────────────────────────────

function createEquipmentActionButton(label, onClick, options = {}) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "equipment-action-btn";
    btn.textContent = label;
    btn.disabled = options.disabled === true;
    btn.onclick = onClick;
    return btn;
}

function createEquipmentQuantityInput(max, value = 1) {
    const input = document.createElement("input");
    input.type = "number";
    input.className = "equipment-qty-input";
    input.min = "1";
    input.max = String(Math.max(1, Math.floor(max || 1)));
    input.value = String(Math.max(1, Math.min(Math.floor(value || 1), Math.floor(max || 1))));
    return input;
}

function readEquipmentQuantityInput(input, max) {
    const fallbackMax = Math.max(1, Math.floor(max || 1));
    const raw = Number(input && input.value);
    if (!Number.isFinite(raw)) return 1;
    return Math.max(1, Math.min(fallbackMax, Math.floor(raw)));
}

function updateInventoryContextPanels() {
    if (G.activeNPCMode === "trade" && G.activeNPC) {
        renderTradeOptions(G.activeNPC);
    } else if (G.activeNPCMode === "object" && G.activeObject) {
        renderRoomObjectActionMenu(G.activeObject);
    }
}

function refreshInventoryUi(statusText = "") {
    renderStats();
    updateInventoryContextPanels();

    if (statusText) {
        if (!G.activeNPC && !G.activeObject && G.activeRoom) {
            const observations = buildObservationNarration(G.activeRoom);
            setNarration(observations ? `${statusText}\n\n${observations}` : statusText);
        } else {
            setNarration(statusText);
        }
    }

    saveGameState();
}

function renderEquipmentSlot(slot) {
    const slotEl = document.getElementById(`eq-slot-${slot}`);
    if (!slotEl) return;

    slotEl.innerHTML = "";

    const meta = getEquipmentSlotMeta(slot);
    const labelEl = document.createElement("b");
    labelEl.textContent = `${meta.icon} ${meta.label}`;
    slotEl.appendChild(labelEl);

    const valueEl = document.createElement("div");
    valueEl.className = "equipment-row-title";

    if (slot === "coinPouch") {
        const coins = getCoinValue(G.player);
        valueEl.textContent = `${coins} coin${coins === 1 ? "" : "s"}`;
        valueEl.classList.toggle("equipment-empty", coins <= 0);
        slotEl.appendChild(valueEl);

        if (coins > 0) {
            const actionsEl = document.createElement("div");
            actionsEl.className = "equipment-row-actions";

            const qtyWrap = document.createElement("label");
            qtyWrap.className = "equipment-qty-wrap";
            qtyWrap.textContent = "Drop";
            const qtyInput = createEquipmentQuantityInput(coins, 1);
            qtyWrap.appendChild(qtyInput);
            actionsEl.appendChild(qtyWrap);

            actionsEl.appendChild(createEquipmentActionButton("Drop", () => {
                const amount = readEquipmentQuantityInput(qtyInput, coins);
                adjustCoins(G.player, -amount);
                if (!dropItemIntoCurrentRoom(createDroppedCoinsItem(amount))) {
                    adjustCoins(G.player, amount);
                    return;
                }
                refreshInventoryUi(`You drop ${amount} coin${amount === 1 ? "" : "s"} to the ground.`);
            }));

            slotEl.appendChild(actionsEl);
        }

        return;
    }

    const item = G.player.equipped[slot];
    valueEl.textContent = item ? getItemName(item) : "(empty)";
    if (!item) valueEl.classList.add("equipment-empty");
    slotEl.appendChild(valueEl);

    if (!item) return;

    const actionsEl = document.createElement("div");
    actionsEl.className = "equipment-row-actions";

    actionsEl.appendChild(createEquipmentActionButton("Remove", () => {
        const removed = moveEquippedItemToInventory(slot);
        if (!removed) return;
        refreshInventoryUi(`You remove ${getItemName(removed)} and stow it in your pack.`);
    }));

    actionsEl.appendChild(createEquipmentActionButton("Drop", () => {
        const itemName = getItemName(item);
        const didDrop = dropEquippedItemToRoom(slot);
        if (!didDrop) return;
        refreshInventoryUi(`You drop ${itemName}.`);
    }));

    slotEl.appendChild(actionsEl);
}

function renderEquipmentInventoryEntry(entry, inventoryEl) {
    const rowEl = document.createElement("div");
    rowEl.className = "equipment-row";

    const headerEl = document.createElement("div");
    headerEl.className = "equipment-row-header";

    const titleWrapEl = document.createElement("div");
    const titleEl = document.createElement("div");
    titleEl.className = "equipment-row-title";
    titleEl.textContent = formatInventoryItemLabel(entry.item, entry.totalQuantity);
    titleWrapEl.appendChild(titleEl);

    const slot = getItemEquipSlot(entry.item);
    const subtitleEl = document.createElement("div");
    subtitleEl.className = "equipment-row-subtitle";
    subtitleEl.textContent = slot ? `Can equip to ${getEquipmentSlotMeta(slot).label}` : "Carry only";
    titleWrapEl.appendChild(subtitleEl);

    headerEl.appendChild(titleWrapEl);
    rowEl.appendChild(headerEl);

    const actionsEl = document.createElement("div");
    actionsEl.className = "equipment-row-actions";

    if (slot) {
        actionsEl.appendChild(createEquipmentActionButton("Equip", () => {
            const itemName = getItemName(entry.item);
            const destination = getEquipmentSlotMeta(slot).label.toLowerCase();
            if (!equipInventoryEntry(entry.key)) return;
            refreshInventoryUi(`You equip ${itemName} to your ${destination}.`);
        }, { disabled: getInventoryEntryMaxEquipAmount(entry) <= 0 }));
    }

    const dropQuantity = entry.totalQuantity;
    let qtyInput = null;
    if (dropQuantity > 1) {
        const qtyWrap = document.createElement("label");
        qtyWrap.className = "equipment-qty-wrap";
        qtyWrap.textContent = "Drop";
        qtyInput = createEquipmentQuantityInput(dropQuantity, 1);
        qtyWrap.appendChild(qtyInput);
        actionsEl.appendChild(qtyWrap);
    }

    actionsEl.appendChild(createEquipmentActionButton("Drop", () => {
        const amount = qtyInput ? readEquipmentQuantityInput(qtyInput, dropQuantity) : 1;
        const dropped = dropInventoryEntryToRoom(entry.key, amount);
        if (!dropped) return;
        refreshInventoryUi(`You drop ${formatInventoryItemLabel(entry.item, amount)}.`);
    }));

    rowEl.appendChild(actionsEl);
    inventoryEl.appendChild(rowEl);
}

function toggleEquipment() {
    document.getElementById("equipmentManager").classList.toggle("active");
    renderEquipment();
}

function renderEquipment() {
    ensurePlayerEquipmentState(G.player);
    getPlayerEquipmentSlots().forEach(renderEquipmentSlot);

    const inventoryEl = document.getElementById("equipmentInventory");
    if (!inventoryEl) return;

    const entries = buildPlayerInventoryEntries(G.player);

    if (!entries.length) {
        inventoryEl.classList.add("empty");
        inventoryEl.textContent = "(nothing carried)";
        return;
    }

    inventoryEl.classList.remove("empty");
    inventoryEl.innerHTML = "";
    entries.forEach(entry => renderEquipmentInventoryEntry(entry, inventoryEl));
}

// ── SPINNER ──────────────────────────────────────────────────────

function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, Math.max(0, ms || 0)));
}

function waitForNextPaint() {
    return new Promise(resolve => {
        requestAnimationFrame(() => requestAnimationFrame(resolve));
    });
}

function countNPCsInRoomMap(roomMap) {
    return Object.values(roomMap || {}).reduce((total, room) => {
        return total + (Array.isArray(room && room.creatures) ? room.creatures.length : 0);
    }, 0);
}

function setLoadingProgress(progress) {
    const barEl = document.getElementById("loadingProgressBar");
    if (!barEl) return;

    const clamped = Math.max(0, Math.min(100, Number(progress) || 0));
    barEl.style.width = `${clamped}%`;
}

function appendLoadingHistory(message) {
    const historyEl = document.getElementById("loadingStepHistory");
    if (!historyEl || !message) return;

    const entryEl = document.createElement("div");
    entryEl.className = "loading-step-entry";
    entryEl.textContent = message;
    historyEl.appendChild(entryEl);

    while (historyEl.children.length > 4) {
        historyEl.removeChild(historyEl.firstChild);
    }
}

function updateLoadingStatus(message, progress, addHistory = false) {
    const logEl = document.getElementById("loadingLog");
    if (logEl) logEl.textContent = message || "Loading...";
    if (typeof progress === "number") setLoadingProgress(progress);
    if (addHistory) appendLoadingHistory(message);
}

async function performLoadingStep(message, progress, action, minDurationMs = 240) {
    updateLoadingStatus(message, progress, true);
    await waitForNextPaint();

    const result = typeof action === "function" ? await action() : null;
    await wait(minDurationMs);
    return result;
}

function showSpinner(msg, title) {
    const titleEl = document.getElementById("loadingTitle");
    const historyEl = document.getElementById("loadingStepHistory");

    if (titleEl) titleEl.textContent = title || "Preparing Adventure";
    if (historyEl) historyEl.innerHTML = "";
    setLoadingProgress(0);
    updateLoadingStatus(msg || "Loading...", 0, false);
    document.getElementById("loadingSpinner").classList.add("active");
}

function hideSpinner() {
    setLoadingProgress(0);
    document.getElementById("loadingSpinner").classList.remove("active");
}
</script>
