const FALLBACK_HUMANOID_SPECIES = ["human", "elf", "dwarf", "halfling", "goblin", "orc"];
const FALLBACK_NON_HUMANOID_SPECIES = ["skeleton", "rat", "ghost"];

function normalizeSpeciesName(species) {
    return String(species || "").toLowerCase();
}

function getSpeciesHumanoidFlag(species) {
    const template = typeof getSpeciesTemplate === "function"
        ? getSpeciesTemplate(species)
        : null;

    if (template && typeof template.isHumanoid === "boolean") {
        return template.isHumanoid;
    }

    const speciesName = normalizeSpeciesName(species);
    if (FALLBACK_HUMANOID_SPECIES.includes(speciesName)) return true;
    if (FALLBACK_NON_HUMANOID_SPECIES.includes(speciesName)) return false;

    return null;
}

function hydrateNPCSpeciesFlags(npc) {
    if (!npc) return npc;
    const humanoidFlag = getSpeciesHumanoidFlag(npc.species);

    if (typeof humanoidFlag === "boolean") {
        npc.isHumanoid = humanoidFlag;
    }

    return npc;
}

function canConverseWithNPC(npc) {
    if (!npc || npc.unconscious || npc.isUnconsciousBody || npc.hidden || npc.isHidden) return false;
    hydrateNPCSpeciesFlags(npc);
    if (typeof ensureNPCRelationshipState === "function") ensureNPCRelationshipState(npc);

    const humanoidFlag = getSpeciesHumanoidFlag(npc.species);
    if (typeof humanoidFlag === "boolean") return humanoidFlag;

    if (typeof npc.isHumanoid === "boolean") {
        return npc.isHumanoid;
    }

    return false;
}

function generateLootUID() {
    return crypto.randomUUID?.() || `${Date.now()}_${Math.random().toString(36).slice(2)}`;
}

function assignLootUID(item) {
    if (!item || typeof item !== "object") return item;
    if (!item._uid) item._uid = generateLootUID();
    if (!item.id) item.id = `loot-${item._uid.slice(-8)}`;
    return item;
}

function cloneLootTemplate(template, overrides = {}) {
    const item = {
        ...template,
        ...overrides,
        type: Array.isArray(template && template.type) ? template.type.slice() : []
    };

    const seed = String(template && template.id ? template.id : item.name || "loot")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
    item.id = `${seed || "loot"}-${Math.random().toString(36).slice(2, 7)}`;

    return assignLootUID(item);
}

function pickLootQuality(kind, options = {}) {
    const basePools = {
        weapon: [
            { name: "worn", score: -1, valueMod: -0.1, weight: 2 },
            { name: "", score: 0, valueMod: 0, weight: 5 },
            { name: "fine", score: 1, valueMod: 0.15, weight: 2 },
            { name: "battle-kept", score: 2, valueMod: 0.3, weight: 1 }
        ],
        armor: [
            { name: "patched", score: -1, valueMod: -0.1, weight: 2 },
            { name: "", score: 0, valueMod: 0, weight: 5 },
            { name: "sturdy", score: 1, valueMod: 0.12, weight: 2 },
            { name: "well-forged", score: 2, valueMod: 0.25, weight: 1 }
        ],
        clothes: [
            { name: "plain", score: 0, valueMod: 0, weight: 5 },
            { name: "well-kept", score: 1, valueMod: 0.1, weight: 3 },
            { name: "tailored", score: 2, valueMod: 0.2, weight: 1 }
        ],
        belt: [
            { name: "", score: 0, valueMod: 0, weight: 4 },
            { name: "stout", score: 1, valueMod: 0.1, weight: 2 }
        ]
    };

    let pool = (basePools[kind] || [{ name: "", score: 0, valueMod: 0, weight: 1 }]).slice();
    if (typeof options.minScore === "number") {
        const filtered = pool.filter(entry => entry.score >= options.minScore);
        if (filtered.length) pool = filtered;
    }

    const totalWeight = pool.reduce((sum, entry) => sum + (entry.weight || 1), 0);
    let roll = Math.random() * totalWeight;
    for (const entry of pool) {
        roll -= entry.weight || 1;
        if (roll <= 0) return entry;
    }
    return pool[pool.length - 1];
}

function buildGeneratedItemDescription(item, baseName, mainType, slot, color, qualityName) {
    const qualityText = qualityName ? `${qualityName} ` : "";
    const colorText = color ? `${color} ` : "";

    if (mainType === "weapon") {
        return `A ${qualityText}${baseName} kept ready for a fight.${item.damage ? ` It looks capable of dealing ${item.damage} damage.` : ""}`;
    }
    if (mainType === "armor") {
        return `A ${colorText}${qualityText}${baseName} made for the ${slot}.${typeof item.armor === "number" ? ` It offers about ${item.armor} armor.` : ""}`;
    }
    if (mainType === "clothes") {
        return `A ${colorText}${qualityText}${baseName} worn on the ${slot}.`;
    }
    if (mainType === "belt") {
        return `A ${qualityText}${baseName} with room for pouches and small tools.`;
    }
    return `A ${qualityText}${baseName}.`;
}

function generateLootItem(mainType, slot, options = {}) {
    const weaponPool = [
        { name: "dagger", damage: 4, value: 6 },
        { name: "short sword", damage: 6, value: 10 },
        { name: "spear", damage: 6, value: 9 },
        { name: "mace", damage: 6, value: 9 },
        { name: "axe", damage: 8, value: 11 },
        { name: "warhammer", damage: 8, value: 13 }
    ];

    const armorPool = {
        head: [
            { name: "cap", armor: 1, value: 4 },
            { name: "hood", armor: 1, value: 4 },
            { name: "helmet", armor: 2, value: 7 }
        ],
        upper: [
            { name: "tunic", armor: 1, value: 5 },
            { name: "vest", armor: 2, value: 7 },
            { name: "leather armor", armor: 4, value: 12 },
            { name: "chain shirt", armor: 5, value: 16 }
        ],
        lower: [
            { name: "trousers", armor: 1, value: 4 },
            { name: "leggings", armor: 2, value: 6 },
            { name: "greaves", armor: 3, value: 10 }
        ],
        feet: [
            { name: "sandals", armor: 0, value: 2 },
            { name: "shoes", armor: 1, value: 3 },
            { name: "boots", armor: 1, value: 5 }
        ]
    };

    const clothesPool = {
        upper: ["shirt", "tunic", "vest", "blouse", "coat"],
        lower: ["trousers", "skirt", "leggings", "pants"],
        feet: ["sandals", "slippers", "shoes", "boots"]
    };

    const beltPool = ["cloth belt", "rope belt", "leather belt", "studded belt"];
    const colors = ["brown", "gray", "black", "tan", "green", "blue", "red", "cream"];
    const quality = pickLootQuality(mainType, options.qualityOptions || {});
    const color = (mainType === "armor" || mainType === "clothes") ? rand(colors) : "";

    let base = null;
    let baseName = "";

    if (mainType === "weapon") {
        base = rand(weaponPool);
        baseName = base.name;
    } else if (mainType === "armor") {
        base = rand((armorPool[slot] || armorPool.upper));
        baseName = base.name;
    } else if (mainType === "clothes") {
        baseName = rand((clothesPool[slot] || clothesPool.upper));
    } else if (mainType === "belt") {
        baseName = rand(beltPool);
    } else {
        return null;
    }

    const displayName = `${quality.name ? quality.name + " " : ""}${color ? color + " " : ""}${baseName}`.trim();
    const item = {
        id: `${mainType}-${slot || "item"}-${Math.random().toString(36).slice(2, 7)}`,
        name: displayName,
        type: [mainType, slot || mainType],
        slot,
        quality: quality.score,
        qualityName: quality.name,
        color,
        value: Math.max(1, Math.round(((base && base.value) || 4) * (1 + quality.valueMod))),
        modifier: Math.max(0, quality.score)
    };

    if (mainType === "weapon") {
        item.damage = Math.max(2, Math.round(base.damage * (1 + quality.valueMod)));
    }
    if (mainType === "armor") {
        item.armor = Math.max(0, Math.round(base.armor * (1 + quality.valueMod)));
        item.modifier = item.armor;
    }
    if (mainType === "belt") {
        item.pouchSlots = quality.score >= 1 ? 5 : 3;
    }

    item.description = buildGeneratedItemDescription(item, baseName, mainType, slot, color, quality.name);
    return assignLootUID(item);
}

const UNIQUE_ROOM_NPC_ROLES = [
    "Bartender", "Innkeeper", "Blacksmith", "Vendor", "Shopkeeper",
    "Wandering Merchant", "Healer", "Priest", "Cook", "Archivist", "Town Guard",
    "Stone Guard", "Cultist", "Miner"
];

function isMerchantRole(role) {
    return [
        "Vendor", "Shopkeeper", "Innkeeper", "Bartender",
        "Wandering Merchant", "Trader", "Blacksmith", "Healer", "Cook"
    ].includes(role);
}

function getTakenRoomRoles(room, pendingNpcs) {
    const taken = new Set();
    const existing = [];
    if (room && Array.isArray(room.creatures)) existing.push(...room.creatures);
    if (Array.isArray(pendingNpcs)) existing.push(...pendingNpcs);

    existing.forEach(npc => {
        if (npc && npc.isHumanoid !== false && npc.role && UNIQUE_ROOM_NPC_ROLES.includes(npc.role)) {
            taken.add(npc.role);
        }
    });

    return taken;
}

function pickWeightedRole(entries, takenRoles) {
    const candidates = (Array.isArray(entries) ? entries : []).filter(entry => {
        if (!entry || !entry.role) return false;
        if (entry.unique && takenRoles && takenRoles.has(entry.role)) return false;
        return true;
    });
    if (!candidates.length) return null;

    const total = candidates.reduce((sum, entry) => sum + (entry.weight || 1), 0);
    let roll = Math.random() * total;
    for (let i = 0; i < candidates.length; i++) {
        const entry = candidates[i];
        roll -= entry.weight || 1;
        if (roll <= 0) return entry.role;
    }
    return candidates[candidates.length - 1].role;
}

function getRequiredLocationRole(roomType, hostileArea, zoneName) {
    if (roomType === "tavern" || roomType === "taproom") return "Bartender";
    if (roomType === "inn" || roomType === "inn common") return "Innkeeper";
    if (roomType === "kitchen") return "Cook";
    if (roomType === "square") return "Vendor";
    if (roomType === "gate") return "Town Guard";
    if (roomType === "underground gate") return "Stone Guard";
    if (roomType === "shrine" || roomType === "altar") return hostileArea ? "Cultist" : "Priest";
    if (roomType === "library" && !hostileArea) return "Archivist";
    if (roomType === "cavern" && zoneName === "Underground City") return "Miner";
    return null;
}

function determineNPCRole(species, room, zoneTemplate, profile, isHumanoid, takenRoles) {
    const roomType = String(room && room.type ? room.type : "").toLowerCase();
    const speciesName = normalizeSpeciesName(species);
    const hostileArea = !!(zoneTemplate && zoneTemplate.hostileArea);
    const zoneName = zoneTemplate && zoneTemplate.name ? zoneTemplate.name : "";
    const roomRole = room && room.role ? room.role : "";

    if (!isHumanoid) {
        if (speciesName === "skeleton") return "Ancient Sentinel";
        if (speciesName === "ghost") return "Restless Spirit";
        if (speciesName === "rat") return "Scavenger";
        return hostileArea ? "Predator" : "Wanderer";
    }

    const requiredRole = getRequiredLocationRole(roomType, hostileArea, zoneName);
    if (requiredRole && (!takenRoles || !takenRoles.has(requiredRole))) {
        return requiredRole;
    }

    const table = getLocationRoleTable(roomType, roomRole, hostileArea, zoneName);
    let role = pickWeightedRole(table, takenRoles);

    if (!role) {
        role = hostileArea
            ? (["aggressive", "hostile"].includes(profile && profile.temperament) ? "Raider" : "Adventurer")
            : "Townsfolk";
    }

    return role;
}

function generateNPCEquipmentItem(slot, npc, zoneTemplate) {
    const role = npc && npc.role ? npc.role : "Wanderer";
    const combatRole = [
        "Town Guard", "Stone Guard", "Adventurer", "Raider", "Scavenger",
        "Scout", "Miner", "Cultist", "Tomb Robber", "Blacksmith"
    ].includes(role) || !!(zoneTemplate && zoneTemplate.hostileArea);

    if (slot === "weapon") {
        const shouldCarryWeapon = combatRole || Math.random() < 0.25;
        return shouldCarryWeapon ? generateLootItem("weapon", slot, {
            qualityOptions: combatRole ? { minScore: 0 } : {}
        }) : null;
    }

    if (slot === "belt") return generateLootItem("belt", slot);

    if (["head", "upper", "lower", "feet"].includes(slot)) {
        const armorChance = combatRole
            ? (slot === "head" ? 0.55 : 0.72)
            : (slot === "upper" ? 0.2 : slot === "feet" ? 0.15 : 0.08);

        if (Math.random() < armorChance) {
            const armorItem = generateLootItem("armor", slot, {
                qualityOptions: combatRole ? { minScore: 0 } : {}
            });
            if (armorItem) return armorItem;
        }

        if (slot === "head") return null;
        return generateLootItem("clothes", slot);
    }

    return null;
}

function calculateNPCArmorFromEquipment(npc) {

function getCoinValue(entity) {
    if (!entity) return 0;
    if (typeof entity.coins === "number") return Math.max(0, entity.coins);

    const equipped = entity.equipped || {};
    const pouch = equipped.coinPouch;
    if (pouch && typeof pouch.value === "number") return Math.max(0, pouch.value);

    return 0;
}

function adjustCoins(entity, delta) {
    if (!entity || typeof delta !== "number") return false;

    const nextValue = Math.max(0, getCoinValue(entity) + delta);
    if (typeof entity.coins === "number" || !entity.equipped || !entity.equipped.coinPouch) {
        entity.coins = nextValue;
        return true;
    }

    entity.equipped.coinPouch.value = nextValue;
    return true;
}

function hasEnoughCoins(entity, amount) {
    return getCoinValue(entity) >= Math.max(0, amount || 0);
}

function getTemperamentModifier(temperament) {
    const key = String(temperament || "neutral").toLowerCase();
    const modifiers = {

        wary: -1,
        neutral: 0,
        bold: 1,
        curious: 2,
        calm: 4,
        friendly: 6
    };

    return typeof modifiers[key] === "number" ? modifiers[key] : 0;
}

function applyNPCImpact(npc, impact = {}) {
    if (!npc) return npc;
    if (typeof applyNPCRelationshipImpact === "function") {
        applyNPCRelationshipImpact(npc, impact);
    } else {
        npc.memory = npc.memory || {};
        if (typeof npc.memory.favorability !== "number") npc.memory.favorability = 0;
        if (typeof npc.hostility !== "number") npc.hostility = 0;
        npc.memory.favorability = Math.max(-100, Math.min(100, npc.memory.favorability + (impact.favor || 0)));
        npc.hostility = Math.max(0, Math.min(100, npc.hostility + (impact.hostility || 0)));
        if (impact.moodOverride) npc.memory.lastMood = impact.moodOverride;
    }

    if (typeof generateNPCBehavior === "function") {
        npc.behavior = generateNPCBehavior(npc);
    }
    if (G.activeNPC === npc && typeof refreshNPCDetailPanel === "function") {
        refreshNPCDetailPanel(npc);
    }
    return npc;
}

function isRomanceEligibleNPC(npc) {
    return typeof isAdultHumanoidNPC === "function" ? isAdultHumanoidNPC(npc) : false;

function classifyConversationChoice(npc, choice) {
    const label = String(choice && (choice.intent || choice.label || choice.text) || "").toLowerCase();
    const favor = npc && npc.memory && typeof npc.memory.favorability === "number" ? npc.memory.favorability : 0;
    const hostility = npc && typeof npc.hostility === "number" ? npc.hostility : 0;
    const attraction = npc && npc.memory && typeof npc.memory.attraction === "number" ? npc.memory.attraction : 0;
    const eligibleForRomance = isRomanceEligibleNPC(npc);

    if (choice && choice.relationshipImpact) return choice.relationshipImpact;
    if (label.includes("greet")) return { mood: 1, favor: 4, hostility: -1, intent: "greeting", markMet: true, actionTag: "greeting" };
    if (label.includes("help")) return { mood: 1, favor: 5, hostility: -1, intent: "help", markMet: true, actionTag: "help" };
    if (label.includes("rumor") || label.includes("seen") || label.includes("place")) return { mood: 0, favor: 1, intent: "curious", markMet: true, actionTag: "question" };
    if (label.includes("calm")) return { mood: 1, favor: 2, hostility: -2, intent: "calm", markMet: true, actionTag: "calm" };
    if (label.includes("compliment")) return { mood: 1, favor: 6, hostility: -1, intent: "flattery", markMet: true, actionTag: "compliment" };
    if (label.includes("apologize")) {
        return hostility >= 60
            ? { mood: 1, favor: 3, hostility: -4, intent: "apology", markMet: true, actionTag: "apology" }
            : { mood: 1, favor: 2, hostility: -2, intent: "apology", markMet: true, actionTag: "apology" };
    }
    if (label.includes("comfort")) {
        return hostility >= 70
            ? { mood: 0, favor: -1, hostility: 1, intent: "comfort", markMet: true, actionTag: "comfort-rebuffed" }
            : { mood: 1, favor: 5, hostility: -2, intent: "comfort", markMet: true, actionTag: "comfort" };
    }
    if (label.includes("flirt")) {
        if (!eligibleForRomance) return { mood: -1, favor: -2, hostility: 1, intent: "awkward", markMet: true, actionTag: "misread-flirt" };
        if (hostility >= 70) return { mood: -1, favor: -4, hostility: 4, attraction: 1, arousal: 2, intent: "flirt", markMet: true, actionTag: "flirt-rejected" };
        if (favor >= 25 || attraction >= 25) return { mood: 1, favor: 3, hostility: -1, attraction: 8, arousal: 6, disinhibition: 3, intent: "flirt", markMet: true, actionTag: "flirt-received" };
        return { mood: 0, favor: 1, hostility: 0, attraction: 4, arousal: 3, disinhibition: 1, intent: "flirt", markMet: true, actionTag: "flirt-tentative" };
    }
    if (label.includes("tease")) {
        if (!eligibleForRomance) return { mood: 0, favor: 0, hostility: 0, intent: "tease", markMet: true, actionTag: "tease" };
        if (favor >= 15 || attraction >= 20) return { mood: 1, favor: 1, hostility: 0, attraction: 5, arousal: 4, disinhibition: 2, intent: "tease", markMet: true, actionTag: "tease-playful" };
        return { mood: -1, favor: -2, hostility: 2, attraction: 1, arousal: 1, intent: "tease", markMet: true, actionTag: "tease-backfire" };
    }
    if (label.includes("sharp") || label.includes("warn") || label.includes("threat")) return { mood: -1, favor: -5, hostility: 5, aggression: 1, intent: "aggression", markMet: true, actionTag: "threat" };
    if (label.includes("goodbye")) return { mood: 0, favor: 1, intent: "goodbye", markMet: true, actionTag: "goodbye" };
    return { mood: 0, favor: 0, intent: "talk", markMet: true, actionTag: "talk" };
}

function isTradeAccepted(playerTotal, npcTotal, npc) {
    if (playerTotal >= npcTotal) return true;

    const d20 = randInt(1, 20);
    const temperamentMod = getTemperamentModifier(npc ? npc.temperament : "neutral");
    const favorMod = npc && npc.memory && typeof npc.memory.favorability === "number"
        ? Math.floor(npc.memory.favorability / 20)
        : 0;
    const hostilityMod = npc && typeof npc.hostility === "number"
        ? -Math.floor(npc.hostility / 25)
        : 0;
    const margin = d20 + temperamentMod + favorMod + hostilityMod;
    const adjustedAsk = Math.max(0, npcTotal - margin);
    const accepted = playerTotal >= adjustedAsk;

    if (npc) {
        if (!npc.memory) npc.memory = {};
        npc.memory.lastTradeCheck = {
            playerTotal,
            npcTotal,
            d20,
            temperamentMod,
            adjustedAsk,
            accepted
        };
    }

    return accepted;
}

const ROOM_DIRECTIONS = ["N","S","E","W","NE","NW","SE","SW"];
const OPPOSITE_DIRECTIONS = {
    N: "S", S: "N",
    E: "W", W: "E",
    NE: "SW", SW: "NE",
    NW: "SE", SE: "NW"
};
const DIRECTION_ALIASES = {
    NORTH: "N",
    SOUTH: "S",
    EAST: "E",
    WEST: "W",
    NORTHEAST: "NE",
    NORTHWEST: "NW",
    SOUTHEAST: "SE",
    SOUTHWEST: "SW"
};

function normalizeDirection(direction) {
    const value = String(direction || "").toUpperCase();
    if (OPPOSITE_DIRECTIONS[value]) return value;
    return DIRECTION_ALIASES[value] || null;
}

function oppositeDirection(direction) {
    const dir = normalizeDirection(direction);
    return dir ? OPPOSITE_DIRECTIONS[dir] : null;
}

function parseCoords(coords) {
    if (typeof coords !== "string") return null;

    const parts = coords.split(",");
    if (parts.length !== 2) return null;

    const x = Number(parts[0]);
    const y = Number(parts[1]);
    if (!isFinite(x) || !isFinite(y)) return null;

    return {
        x,
        y,
        key: `${x},${y}`
    };
}

function getAdjacentCoords(coords, direction) {
    const origin = parseCoords(coords);
    const dir = normalizeDirection(direction);
    if (!origin || !dir) return null;

    const off = dirToOffset(dir);
    return `${origin.x + off.x},${origin.y + off.y}`;
}

function getBuildableRoomTypesForZone(zoneName) {
    const zoneTemplate = getZoneTemplate(zoneName);
    const roomTypes = zoneTemplate && Array.isArray(zoneTemplate.roomTypes)
        ? zoneTemplate.roomTypes
        : [];

    return roomTypes.filter(roomType => !!getRoomTemplate(roomType));
}

function chooseRoomTypeForZone(zoneName, fallbackRoomType) {
    const buildableTypes = getBuildableRoomTypesForZone(zoneName);
    if (buildableTypes.length > 0) return rand(buildableTypes);

    if (fallbackRoomType && getRoomTemplate(fallbackRoomType)) {
        return fallbackRoomType;
    }

    if (getRoomTemplate("Street")) return "Street";
    if (getRoomTemplate("Corridor")) return "Corridor";
    return fallbackRoomType || "Street";
}

function ensureRoomExits(room) {
    if (!room) return null;

    if (!room.exits || typeof room.exits !== "object" || Array.isArray(room.exits)) {
        room.exits = {};
    }

    return room.exits;
}

function setRoomExit(room, direction, targetCoords) {
    const exits = ensureRoomExits(room);
    const dir = normalizeDirection(direction);
    const target = parseCoords(targetCoords);
    if (!exits || !dir || !target) return false;

    if (exits[dir] === target.key) return false;
    exits[dir] = target.key;
    return true;
}

function repairRoomExits(room) {
    if (!room) return false;

    const origin = parseCoords(room.coords);
    const exits = ensureRoomExits(room);
    let changed = false;

    if (!origin || !exits) return changed;

    Object.keys(exits).forEach(originalDir => {
        const dir = normalizeDirection(originalDir);
        const target = parseCoords(exits[originalDir]);

        if (!dir || !target) {
            delete exits[originalDir];
            changed = true;
            return;
        }

        const expectedCoords = getAdjacentCoords(origin.key, dir);
        if (target.key !== expectedCoords) {
            delete exits[originalDir];
            changed = true;
            return;
        }

        if (originalDir !== dir) {
            delete exits[originalDir];
            exits[dir] = target.key;
            changed = true;
            return;
        }

        if (exits[dir] !== target.key) {
            exits[dir] = target.key;
            changed = true;
        }
    });

    return changed;
}

function repairRoomMapExits() {
    if (!G.roomMap || typeof G.roomMap !== "object") {
        G.roomMap = {};
        return true;
    }

    let changed = false;
    const coordsList = Object.keys(G.roomMap);

    coordsList.forEach(coords => {
        const room = G.roomMap[coords];
        const parsed = parseCoords(coords);

        if (!room || !parsed) return;

        if (room.coords !== parsed.key) {
            room.coords = parsed.key;
            changed = true;
        }

        if (repairRoomExits(room)) changed = true;
    });

    coordsList.forEach(coords => {
        const room = G.roomMap[coords];
        if (!room) return;

        Object.keys(room.exits || {}).forEach(dir => {
            const targetCoords = room.exits[dir];
            const targetRoom = G.roomMap[targetCoords];
            const backDir = oppositeDirection(dir);

            if (!targetRoom || !backDir) return;
            if (setRoomExit(targetRoom, backDir, coords)) changed = true;
        });
    });

    return changed;
}

// ── STORY DIRECTOR ───────────────────────────────────────────────

function createStoryDirectorState() {
    return {
        act: 1,
        tension: 15,
        activeThreads: [],
        discoveredFacts: [],
        recentEvents: [],
        unresolvedQuestions: [],
        turnCounter: 0,
        eventCounter: 0,
        flags: {}
    };
}

function clampStoryTension(value) {
    return Math.max(0, Math.min(100, value));
}

function ensureStoryStateShape(story) {
    const next = story && typeof story === "object" ? story : createStoryDirectorState();

    if (typeof next.act !== "number") next.act = 1;
    if (typeof next.tension !== "number") next.tension = 15;
    if (!Array.isArray(next.activeThreads)) next.activeThreads = [];
    if (!Array.isArray(next.discoveredFacts)) next.discoveredFacts = [];
    if (!Array.isArray(next.recentEvents)) next.recentEvents = [];
    if (!Array.isArray(next.unresolvedQuestions)) next.unresolvedQuestions = [];
    if (typeof next.turnCounter !== "number") next.turnCounter = 0;
    if (typeof next.eventCounter !== "number") next.eventCounter = 0;
    if (!next.flags || typeof next.flags !== "object" || Array.isArray(next.flags)) next.flags = {};

    return next;
}

function getCurrentStoryTurn() {
    G.story = ensureStoryStateShape(G.story);
    return G.story.turnCounter || 0;
}

function advanceStoryTurn(steps = 1) {
    G.story = ensureStoryStateShape(G.story);
    const amount = Math.max(0, Math.floor(steps || 0));
    G.story.turnCounter += amount;
    return G.story.turnCounter;
}

function setStoryFlag(flag, value = true) {
    if (!flag) return null;
    G.story = ensureStoryStateShape(G.story);
    G.story.flags[String(flag)] = value;
    return value;
}

function clearStoryFlag(flag) {
    if (!flag) return false;
    G.story = ensureStoryStateShape(G.story);
    delete G.story.flags[String(flag)];
    return true;
}

function hasStoryFlag(flag) {
    if (!flag) return false;
    G.story = ensureStoryStateShape(G.story);
    return !!G.story.flags[String(flag)];
}

function rememberStoryEvent(type, text, weight, options = {}) {
    G.story = ensureStoryStateShape(G.story);
    if (typeof weight !== "number") weight = 0;

    const eventTags = Array.isArray(options && options.tags)
        ? options.tags.map(tag => String(tag || "").trim()).filter(Boolean)
        : [];
    G.story.eventCounter += 1;

    G.story.recentEvents.unshift({
        type,
        text,
        room: G.activeRoom ? (G.activeRoom.displayName || G.activeRoom.name || null) : null,
        turn: getCurrentStoryTurn(),
        time: Date.now(),
        eventCounter: G.story.eventCounter,
        tags: eventTags
    });

    G.story.recentEvents = G.story.recentEvents.slice(0, 8);
    G.story.tension = clampStoryTension((G.story.tension || 0) + weight);

    if (Array.isArray(options && options.flags)) {
        options.flags.forEach(flag => setStoryFlag(flag, true));
    } else if (options && options.flags && typeof options.flags === "object") {
        Object.entries(options.flags).forEach(([flag, value]) => setStoryFlag(flag, value));
    }
}

function addStoryFact(text) {
    if (!G.story) G.story = createStoryDirectorState();
    if (!text || G.story.discoveredFacts.includes(text)) return;
    G.story.discoveredFacts.push(text);
    G.story.discoveredFacts = G.story.discoveredFacts.slice(-12);
}

function addStoryQuestion(text) {
    if (!G.story) G.story = createStoryDirectorState();
    if (!text || G.story.unresolvedQuestions.includes(text)) return;
    G.story.unresolvedQuestions.push(text);
    G.story.unresolvedQuestions = G.story.unresolvedQuestions.slice(-8);
}

function ensureStoryThread(seed) {
    if (!G.story) G.story = createStoryDirectorState();
    if (!seed || !seed.id) return null;

    let thread = G.story.activeThreads.find(t => t.id === seed.id);
    if (!thread) {
        thread = {
            id: seed.id,
            title: seed.title,
            status: "active",
            intensity: seed.intensity || 20,
            beats: []
        };
        G.story.activeThreads.push(thread);
    }

    return thread;
}

function addStoryBeat(threadId, text, intensityDelta) {
    if (typeof intensityDelta !== "number") intensityDelta = 0;

    const thread = ensureStoryThread({
        id: threadId,
        title: threadId.split("-").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ")
    });
    if (!thread || !text) return;

    thread.beats.push({
        text,
        room: G.activeRoom ? (G.activeRoom.displayName || G.activeRoom.name || null) : null,
        turn: Date.now()
    });
    thread.beats = thread.beats.slice(-6);
    thread.intensity = clampStoryTension((thread.intensity || 0) + intensityDelta);
}

function updateStoryOnAdventureStart(zone, roomType) {
    G.story = createStoryDirectorState();

    const title = `${zone} Rumblings`;
    ensureStoryThread({
        id: `local-${String(zone).toLowerCase()}`,
        title,
        intensity: 20
    });

    addStoryFact(`${G.player.name} began their adventure in ${zone}.`);
    addStoryQuestion(`What is unsettled beneath the ordinary life of ${zone}?`);
    rememberStoryEvent("start", `The adventure began in ${roomType}.`, 5);
}

function updateStoryOnRoomEntered(room, direction) {
    if (!room) return;

    const danger = deriveRoomContext(room).danger;
    const roomName = room.displayName || room.name || room.type || "an unknown place";
    const hasNPCs = Array.isArray(room.creatures) && room.creatures.length > 0;

    let weight = danger === "hostile" ? 12 : danger === "tense" ? 6 : -1;
    if (hasNPCs) weight += 2;

    rememberStoryEvent("movement", `${G.player.name} moved ${direction} into ${roomName}.`, weight);

    if (danger === "hostile") {
        addStoryQuestion(`What danger is waiting in ${roomName}?`);
        addStoryBeat("local-danger", `${roomName} felt dangerous.`, 8);
    } else if (hasNPCs) {
        addStoryBeat("local-encounters", `${roomName} held someone worth noticing.`, 3);
    }

    if ((G.story.tension || 0) >= 70 && G.story.act < 2) {
        G.story.act = 2;
        rememberStoryEvent("act-shift", "The story pressure rose into a more dangerous phase.", 0);
    }
}

function updateStoryOnNpcInteraction(npc, playerInput, responseText) {
    if (!npc) return;

    const npcName = npc.name || "Someone";
    const summary = `${G.player.name} spoke with ${npcName}: "${playerInput.slice(0, 80)}"`;
    rememberStoryEvent("conversation", summary, 2);

    if (!npc.memory.metPlayer) {
        addStoryFact(`${G.player.name} met ${npcName}.`);
        addStoryBeat("local-encounters", `${npcName} entered the story.`, 4);
    }

    const lowerInput = playerInput.toLowerCase();
    const lowerResponse = String(responseText || "").toLowerCase();
    if (lowerInput.includes("rumor") || lowerInput.includes("secret") || lowerResponse.includes("secret")) {
        addStoryQuestion(`What does ${npcName} know that has not been said plainly?`);
        addStoryBeat("local-rumors", `${npcName} hinted that there may be more to learn.`, 6);
    }
}

const SAVE_KEY = "cyoaftwSave";

function isValidSavedGame(save) {
    return !!(
        save &&
        save.version === 1 &&
        save.player &&
        save.roomMap &&
        save.player.coords &&
        save.roomMap[save.player.coords]
    );
}

function readSavedGame() {
    try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return null;

        const save = JSON.parse(raw);
        if (!isValidSavedGame(save)) return null;
        return save;

    } catch (err) {
        console.warn("Saved game read failed:", err);
        return null;
    }
}

function hasSavedGame() {
    return !!readSavedGame();
}

function formatSavedAt(savedAt) {
    if (!savedAt) return "unknown time";

    const date = new Date(savedAt);
    if (isNaN(date.getTime())) return "unknown time";

    return date.toLocaleString();
}

function escapeHtml(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
}

function getSavedGameSummary(save) {
    const player = save.player || {};
    const room = save.roomMap[player.coords] || {};
    const location = room.displayName || room.name || room.type || player.coords || "unknown location";
    const zone = room.zone ? `${room.zone} - ` : "";
    const savedAt = save.meta ? save.meta.savedAt : null;

    return `${escapeHtml(player.name || "Adventurer")} the ${escapeHtml(player.class || "Adventurer")}<br>` +
        `${escapeHtml(zone)}${escapeHtml(location)}<br>` +
        `Saved ${escapeHtml(formatSavedAt(savedAt))}`;
}

function showSavedGamePrompt() {
    const promptEl = document.getElementById("savedGamePrompt");
    const setupEl = document.getElementById("setupWrapper");
    const summaryEl = document.getElementById("savedGameSummaryEl");
    if (!promptEl || !setupEl || !summaryEl) return;

    const save = readSavedGame();
    if (!save) {
        hideSavedGamePrompt();
        return;
    }

    summaryEl.innerHTML = getSavedGameSummary(save);
    promptEl.classList.add("active");
    setupEl.classList.add("save-prompt-active");
}

function hideSavedGamePrompt() {
    const promptEl = document.getElementById("savedGamePrompt");
    const setupEl = document.getElementById("setupWrapper");

    if (promptEl) promptEl.classList.remove("active");
    if (setupEl) setupEl.classList.remove("save-prompt-active");
}

function clearSavedGame() {
    try {
        localStorage.removeItem(SAVE_KEY);
        return true;
    } catch (err) {
        console.warn("Saved game clear failed:", err);
        return false;
    }
}

function showSetupScreen() {
    const setupEl = document.getElementById("setupWrapper");
    const gameEl = document.getElementById("gameWrapper");

    if (setupEl) setupEl.style.display = "flex";
    if (gameEl) gameEl.classList.remove("active");
}

function showGameScreen() {
    const setupEl = document.getElementById("setupWrapper");
    const gameEl = document.getElementById("gameWrapper");

    if (setupEl) setupEl.style.display = "none";
    if (gameEl) gameEl.classList.add("active");
}

function startNewAdventureFromPrompt() {
    clearSavedGame();
    hideSavedGamePrompt();
    setupGoTo(1);
}

function resetNpcPanel() {
    const placeholderEl = document.getElementById("npcPlaceholderEl");
    const detailEl = document.getElementById("npcDetailEl");

    if (placeholderEl) placeholderEl.style.display = "block";
    if (detailEl) detailEl.classList.remove("active");
    G.activeObject = null;
    G.activeNPCMode = null;
    clearChatOptions();
    setExitGridVisible(true);
}

async function resumeSavedGame() {
    const save = readSavedGame();
    if (!save) {
        hideSavedGamePrompt();
        showSetupScreen();
        return false;
    }

    const roomCount = Object.keys(save.roomMap || {}).length;
    const npcCount = countNPCsInRoomMap(save.roomMap);

    showSpinner("Reopening your saved adventure...", "Resuming Adventure");
    await waitForNextPaint();

    await performLoadingStep(`Restoring ${roomCount} explored room${roomCount === 1 ? "" : "s"}...`, 32, () => {
        G.player = save.player;
        ensurePlayerEquipmentState(G.player);
        G.roomMap = save.roomMap || {};
        G.story = ensureStoryStateShape(save.story || createStoryDirectorState());
        repairRoomMapExits();
        G.activeRoom = G.roomMap[G.player.coords] || null;
        G.activeNPC = null;
        G.activeObject = null;
        G.activeNPCMode = null;
        G.prefetchCache = {};
        G.prefetchQueue = [];
        G.isPrefetching = false;
        clearConversationRuntimeState();
    });

    if (!G.activeRoom) {
        hideSpinner();
        console.warn("Saved game is missing the active room.");
        clearSavedGame();
        hideSavedGamePrompt();
        showSetupScreen();
        return false;
    }

    await performLoadingStep(`Restoring NPC records and nearby encounters (${npcCount} total)...`, 62, () => {
        const activeNPCId = save.meta ? save.meta.activeNPCId : null;
        if (activeNPCId && Array.isArray(G.activeRoom.creatures)) {
            for (let i = 0; i < G.activeRoom.creatures.length; i++) {
                if (G.activeRoom.creatures[i].id === activeNPCId) {
                    hydrateNPCSpeciesFlags(G.activeRoom.creatures[i]);
                    G.activeNPC = G.activeRoom.creatures[i];
                    break;
                }
            }
        }
    });

    await performLoadingStep("Rebuilding panels, exits, and room details...", 86, () => {
        showGameScreen();
        clearChatLog();
        renderRoom();
        renderStats();

        if (G.activeNPC) {
            selectNPC(G.activeNPC);
        } else {
            resetNpcPanel();
        }
    });

    await performLoadingStep("Picking up the story where you left off...", 98, () => {
        schedulePrefetch();
        renderRoomNarration(G.activeRoom, "resume", null);
        saveGameState();
    });

    updateLoadingStatus("Adventure restored.", 100);
    await wait(180);
    hideSpinner();
    return true;
}

function initSavedGamePrompt() {
    showSetupScreen();
    if (hasSavedGame()) {
        showSavedGamePrompt();
    } else {
        hideSavedGamePrompt();
    }
}

if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initSavedGamePrompt);
} else {
    initSavedGamePrompt();
}

function saveGameState() {
    try {
        repairRoomMapExits();
        ensurePlayerEquipmentState(G.player);

        const saveData = {
            version: 1,

            player: G.player,

            roomMap: G.roomMap,

            story: G.story,

            meta: {
                savedAt: Date.now(),
                activeNPCId: G.activeNPC ? G.activeNPC.id : null
            }
        };

        localStorage.setItem(
            SAVE_KEY,
            JSON.stringify(saveData)
        );

        console.log("Game saved.");
        return true;

    } catch (err) {
        console.error("Save failed:", err);
        return false;
    }
}



// ── ROOM GENERATION ──────────────────────────────────────────────

function createRoomSkeleton(coords, zoneName, roomType) {
    const parsed = parseCoords(coords);
    if (!parsed) return null;

    const buildRoomType = getRoomTemplate(roomType)
        ? roomType
        : chooseRoomTypeForZone(zoneName, "Street");
    const room = buildRoomInstance(buildRoomType, zoneName);
    if (!room) return null;

    room.coords = parsed.key;
    return room;
}

function assignGeneratedExits(room, zoneName) {
    if (!room || !room.coords) return {};
    room.exits = generateExits(room.coords, zoneName);
    return room.exits;
}

function assignGeneratedNPCs(room, zoneName) {
    if (!room) return [];
    room.creatures = spawnNPCsForRoom(room, zoneName);
    return room.creatures;
}

function finalizeGeneratedRoom(room) {
    if (!room || !room.coords) return null;
    repairRoomExits(room);
    setRoom(room.coords, room);
    return room;
}

function getOrCreateRoom(coords, zoneName, roomType) {
    const parsed = parseCoords(coords);
    if (!parsed) return null;

    if (G.roomMap[parsed.key]) {
        repairRoomExits(G.roomMap[parsed.key]);
        return G.roomMap[parsed.key];
    }

    const room = createRoomSkeleton(parsed.key, zoneName, roomType);
    if (!room) return null;

    assignGeneratedExits(room, zoneName);
    assignGeneratedNPCs(room, zoneName);
    return finalizeGeneratedRoom(room);
}

function generateExits(coords, zoneName) {
    const origin = parseCoords(coords);
    const exits = {};
    if (!origin) return exits;

    const count = randInt(1, 3);
    const shuffled = ROOM_DIRECTIONS.slice().sort(() => Math.random() - 0.5);
    for (let i = 0; i < count; i++) {
        const dir = shuffled[i];
        exits[dir] = getAdjacentCoords(origin.key, dir);
    }
    return exits;
}

function dirToOffset(dir) {
    const map = {
        N:  { x:  0, y:  1 }, S:  { x:  0, y: -1 },
        E:  { x:  1, y:  0 }, W:  { x: -1, y:  0 },
        NE: { x:  1, y:  1 }, NW: { x: -1, y:  1 },
        SE: { x:  1, y: -1 }, SW: { x: -1, y: -1 }
    };
    return map[dir] || { x: 0, y: 0 };
}

// ── NPC SPAWNING ─────────────────────────────────────────────────

function spawnNPCsForRoom(room, zoneName) {
    const npcs = [];
    if (room.role === "spine") return npcs;

    const zone = getZoneTemplate(zoneName);
    if (!zone) return npcs;

    const count = room.role === "landmark" ? randInt(1, 3) : randInt(0, 2);
    const takenRoles = getTakenRoomRoles(room, npcs);
    for (let i = 0; i < count; i++) {
        const species = rand(zone.allowedSpecies);
        const npc = createNPC(species, room, zone, { takenRoles });
        if (npc) {
            npcs.push(npc);
            if (npc.isHumanoid !== false && npc.role && UNIQUE_ROOM_NPC_ROLES.includes(npc.role)) {
                takenRoles.add(npc.role);
            }
        }
    }
    return npcs;
}

function createNPC(species, room, zoneTemplate, options = {}) {
    const isHumanoid = getSpeciesHumanoidFlag(species) === true;
    const profile     = getRandomPersonalityProfile({});
    const role        = determineNPCRole(species, room, zoneTemplate, profile, isHumanoid, options.takenRoles);
    const ageCategory = getAgeCategoryForRole(role, profile.archetype);
    const age         = isHumanoid ? getRandomAge(ageCategory) : null;
    const gender      = isHumanoid ? (Math.random() < 0.5 ? "male" : "female") : "none";
    const temperament = profile.temperament;

    const npc = {
        id:               `${species.toLowerCase()}-${Math.random().toString(36).slice(2, 7)}`,
        name:             isHumanoid ? `${gender === "male" ? "a male" : "a female"} ${species}` : `a ${species}`,
        species,
        isHumanoid,
        gender,
        role,
        temperament,
        hostility:        typeof getBaseHostilityForTemperament === "function"
            ? getBaseHostilityForTemperament(temperament)
            : (temperament === "hostile" ? randInt(60, 90) : randInt(0, 40)),
        age,
        ageCategory,
        personalityProfile: profile,
        personalityTraits:  profile.traits,
        speechStyle:        "common",
        hp: 10, hpMax: 10,
        inventory: [],
        equipped:  {},
        memory: {
            metPlayer:       false,
            favorability:    typeof getBaseFavorabilityForTemperament === "function"
                ? getBaseFavorabilityForTemperament(temperament)
                : (temperament === "hostile" ? -40 : 0),
            lastMood:        "neutral",
            playerActions:   [],
            playerActionTags: [],
            recentLines:     [],
            aggressionCount: 0
        }
    };
    if (typeof ensureNPCRelationshipState === "function") ensureNPCRelationshipState(npc);
    if (typeof syncNPCSpeechProfile === "function") syncNPCSpeechProfile(npc, room, zoneTemplate);

    seedNPCStartingLoot(npc, room, zoneTemplate);

    if (typeof generateNPCEnrichment === "function") {
        generateNPCEnrichment(npc, room, zoneTemplate);
    }

    npc.backstory = generateNPCBackstory(npc, room, zoneTemplate);
    npc.action   = generatePostureOrAction(temperament);
    npc.behavior = generateNPCBehavior(npc);
    return npc;
}

// ── MOVEMENT ─────────────────────────────────────────────────────

function movePlayer(direction) {
    const dir = normalizeDirection(direction);
    const room = G.activeRoom;
    if (!room || !dir) return;
    advanceNPCAffectTime(2);

    if (!room.coords && G.player && G.player.coords) room.coords = G.player.coords;
    repairRoomExits(room);

    const target = parseCoords(room.exits[dir]);
    const expectedCoords = getAdjacentCoords(room.coords, dir);
    if (!target || target.key !== expectedCoords) {
        if (room.exits) delete room.exits[dir];
        renderRoom();
        saveGameState();
        console.warn("Removed invalid exit", dir, "from", room.coords);
        return;
    }

    const newCoords    = target.key;
    const zone         = G.activeRoom.zone || "Town";
    const roomType     = chooseRoomTypeForZone(zone, "Street");

    const newRoom = getOrCreateRoom(newCoords, zone, roomType);
    if (!newRoom) {
        delete room.exits[dir];
        renderRoom();
        saveGameState();
        console.warn("Room creation failed for", newCoords);
        return;
    }

    setRoomExit(newRoom, oppositeDirection(dir), room.coords);
    repairRoomMapExits();

    G.player.coords = newCoords;
    G.activeRoom = newRoom;
    G.activeNPC  = null;
    G.activeNPCMode = null;
    advanceStoryTurn(1);
    updateStoryOnRoomEntered(newRoom, dir);

    clearChatLog();
    renderRoom();
    schedulePrefetch();

    renderRoomNarration(G.activeRoom, "move", dir);

    saveGameState();
}

// ── PREFETCH ─────────────────────────────────────────────────────

function getPrefetchTaskPriority(task) {
    return task && typeof task.priority === "number" ? task.priority : 0;
}

function enqueuePrefetchTask(task) {
    if (!task || !task.key) return false;
    if (G.prefetchQueue.find(entry => entry && entry.key === task.key)) return false;
    G.prefetchQueue.push(task);
    return true;
}

function dequeueNextPrefetchTask() {
    if (!Array.isArray(G.prefetchQueue) || !G.prefetchQueue.length) return null;

    let bestIndex = 0;
    let bestPriority = getPrefetchTaskPriority(G.prefetchQueue[0]);
    for (let i = 1; i < G.prefetchQueue.length; i++) {
        const priority = getPrefetchTaskPriority(G.prefetchQueue[i]);
        if (priority > bestPriority) {
            bestPriority = priority;
            bestIndex = i;
        }
    }

    return G.prefetchQueue.splice(bestIndex, 1)[0] || null;
}

function schedulePrefetch() {
    const room = G.activeRoom;
    if (!room) return;

    Object.entries(room.exits).forEach(([dir, coords]) => {
        const key = `desc:${coords}`;
        if (G.prefetchCache[key]) return;
        enqueuePrefetchTask({
            key,
            priority: 0,
            build: () => {
                const z  = room.zone || "Town";
                const rt = chooseRoomTypeForZone(z, "Street");
                const pr = buildRoomInstance(rt, z);
                return buildPrompt(pr, null,
                    "Write 1 sentence of atmospheric description for this location. Be vivid and brief."
                );
            }
        });
    });

    runPrefetchQueue();
}

async function runPrefetchQueue() {
    if (G.isPrefetching || G.prefetchQueue.length === 0) return;
    G.isPrefetching = true;

    const task = dequeueNextPrefetchTask();
    try {
        if (task && typeof task.run === "function") {
            await task.run();
        } else {
            const prompt = task.build();
            const result = await ai({ instruction: prompt, endButtons: "none" });
            G.prefetchCache[task.key] = result.text || result;
        }
    } catch(e) {
        console.warn("Prefetch failed:", task.key, e);
    } finally {
        if (task && typeof task.finalize === "function") task.finalize();
    }

    G.isPrefetching = false;
    if (G.prefetchQueue.length > 0) setTimeout(runPrefetchQueue, 800);
}

// ── NPC INTERACTION ──────────────────────────────────────────────

function hashConversationKey(value) {
    const source = String(value || "");
    let hash = 5381;
    for (let i = 0; i < source.length; i++) {
        hash = ((hash << 5) + hash) + source.charCodeAt(i);
        hash = hash >>> 0;
    }
    return hash.toString(36);
}

function buildRecentConversationDigest(npc, maxTurns = 4) {
    if (!npc || !npc.memory || !Array.isArray(npc.memory.recentLines)) return "";
    return npc.memory.recentLines
        .slice(-maxTurns)
        .map(line => `${line && line.speaker || "npc"}:${line && line.intent || "talk"}:${line && line.text || ""}`)
        .join("|")
        .slice(0, 320);
}

function buildConversationBundleKey(npc, options, room, ctx) {
    const relevantOptions = Array.isArray(options)
        ? options.filter(option => option && !option.action && (option.promptText || option.text))
        : [];
    const signature = JSON.stringify({
        npcId: npc && npc.id ? npc.id : npc && npc.name ? npc.name : "npc",
        room: room && room.coords ? room.coords : room && room.name ? room.name : "",
        metPlayer: !!(ctx && ctx.metPlayer),
        relationship: ctx && ctx.relationship || "",
        disposition: ctx && ctx.disposition || "",
        favor: ctx && typeof ctx.favor === "number" ? ctx.favor : 0,
        hostility: ctx && typeof ctx.hostility === "number" ? ctx.hostility : 0,
        attraction: ctx && typeof ctx.attraction === "number" ? ctx.attraction : 0,
        arousal: ctx && typeof ctx.arousal === "number" ? ctx.arousal : 0,
        interactionCount: ctx && typeof ctx.interactionCount === "number" ? ctx.interactionCount : 0,
        sessionInteractionCount: ctx && typeof ctx.sessionInteractionCount === "number" ? ctx.sessionInteractionCount : 0,
        lastOptionId: ctx && ctx.lastOptionId || "",
        recent: buildRecentConversationDigest(npc),
        options: relevantOptions.map(option => ({
            id: option.id || "",
            intent: option.intent || "",
            text: option.promptText || option.text || ""
        }))
    });
    return `talk:${hashConversationKey(signature)}`;
}

function getConversationReplyKey(bundleKey, optionId) {
    return `${bundleKey}:${String(optionId || "").trim()}`;
}

function getConversationSessionReplyKey(npc, optionId) {
    if (!npc) return "";
    const optionKey = String(optionId || "").trim();
    if (!optionKey) return "";
    const state = typeof ensureNPCConversationState === "function"
        ? ensureNPCConversationState(npc)
        : null;
    const sessionNumber = state && typeof state.sessionNumber === "number" ? state.sessionNumber : 0;
    const npcKey = npc.id || npc.name || "npc";
    return `${npcKey}:${sessionNumber}:${optionKey}`;
}

function getCachedConversationReply(npc, choice) {
    if (!choice) return "";
    if (choice._conversationReplyKey && runtimeConversationState.replyCache[choice._conversationReplyKey]) {
        return runtimeConversationState.replyCache[choice._conversationReplyKey];
    }

    const sessionKey = getConversationSessionReplyKey(npc, choice.id);
    if (sessionKey && runtimeConversationState.sessionReplyCache[sessionKey]) {
        return runtimeConversationState.sessionReplyCache[sessionKey];
    }

    return "";
}

function storeCachedConversationReply(npc, option, replyText) {
    const normalized = normalizeNPCReplyText(replyText);
    if (!normalized) return "";

    if (option && option.replyKey) {
        runtimeConversationState.replyCache[option.replyKey] = normalized;
    } else if (option && option._conversationReplyKey) {
        runtimeConversationState.replyCache[option._conversationReplyKey] = normalized;
    }

    const optionId = option && (option.id || option.optionId);
    const sessionKey = getConversationSessionReplyKey(npc, optionId);
    if (sessionKey) {
        runtimeConversationState.sessionReplyCache[sessionKey] = normalized;
    }

    return normalized;
}

function getNPCConversationReplyBaseLines(npc, room) {
    const speechProfile = typeof syncNPCSpeechProfile === "function"
        ? syncNPCSpeechProfile(npc, room, null)
        : (typeof getNPCSpeechProfile === "function" ? getNPCSpeechProfile(npc, room, null) : null);
    const relationshipGuidance = typeof getNPCRelationshipSpeechGuidance === "function"
        ? getNPCRelationshipSpeechGuidance(npc)
        : null;
    const knowsPlayer = !!(npc && npc.memory && npc.memory.metPlayer);

    return [
        `You are ${npc.name}, a ${npc.species}${npc.role ? ` working here as ${npc.role}` : ""}.`,
        knowsPlayer
            ? "You already know the player. Do not treat them as a stranger or restart introductions."
            : "If this is a first meeting, answer like someone being approached for the first time.",
        "Stay in character and stay brief: 1 to 3 short sentences.",
        "Answer the player's question or approach directly before adding any attitude, suspicion, or warmth.",
        "Use normal spoken language. Keep it grounded and easy to read.",
        "Do not break character. Do not refer to yourself as an AI.",
        "Do not write purple prose, fantasy-trope narration, or stagey lines about eyes, fingers, tavern stones, cages, air, or whispers unless the player directly asks about them.",
        "Do not default to vague hints. If the NPC is evasive, let them be plain and evasive rather than cryptic and theatrical.",
        "If you include a visible action, keep it to one short clause at most.",
        relationshipGuidance ? `Relationship baseline: ${relationshipGuidance.baseline}. ${relationshipGuidance.instruction}` : "",
        relationshipGuidance ? `Subtle cue for this reply: ${relationshipGuidance.cue}. Keep it understated.` : "",
        speechProfile ? `Speech target: ${speechProfile.style}. Example tone: "${speechProfile.sample}"` : "",
        speechProfile ? `Speech habits: ${speechProfile.sentenceLength} sentences, ${speechProfile.vocabulary}, ${speechProfile.cadence}.` : "",
        speechProfile && speechProfile.avoid.length ? `Avoid these habits: ${speechProfile.avoid.join(", ")}.` : "",
        "If there is romantic tension, keep it mild, readable, and non-explicit."
    ].filter(Boolean);
}

function buildSingleConversationInstruction(npc, interaction, room) {
    const playerInput = typeof interaction === "string"
        ? interaction
        : (interaction && (interaction.promptText || interaction.text) ? (interaction.promptText || interaction.text) : "");
    const intent = interaction && interaction.intent ? interaction.intent : "talk";
    return [
        ...getNPCConversationReplyBaseLines(npc, room),
        `The player says: "${playerInput}"`,
        `Conversation intent: ${intent}.`
    ].join("\n");
}

function buildConversationBatchInstruction(npc, options, room) {
    const relevantOptions = Array.isArray(options)
        ? options.filter(option => option && !option.action && (option.promptText || option.text))
        : [];
    const optionList = relevantOptions.map(option => {
        const playerText = String(option.promptText || option.text || "").replace(/\s+/g, " ").trim();
        return {
            id: String(option.id || "").trim(),
            intent: String(option.intent || "talk"),
            player: playerText
        };
    });

    return [
        ...getNPCConversationReplyBaseLines(npc, room),
        "Generate one short NPC reply for each player approach below.",
        "Return only valid JSON.",
        "The engine already starts the output with: {\"replies\":[",
        "Continue that JSON array with reply objects and close the JSON cleanly.",
        "Each reply object must look like: {\"id\":\"option-id\",\"text\":\"reply text\"}",
        "Rules:",
        "- Include exactly one reply object for every option id provided.",
        "- Copy each id exactly.",
        "- Keep each text to 1 to 3 short sentences.",
        "- Use double-quoted JSON strings and escape internal quotes properly.",
        "- Do not add markdown fences, comments, or extra keys.",
        `OPTIONS_JSON: ${JSON.stringify(optionList)}`
    ].join("\n");
}

function tryParseConversationJSON(rawText) {
    const source = String(rawText || "")
        .replace(/[“”]/g, "\"")
        .replace(/[‘’]/g, "'")
        .trim();
    if (!source) return null;

    const candidates = [source];
    const fenceMatch = source.match(/```(?:json)?\s*([\s\S]*?)```/i);
    if (fenceMatch && fenceMatch[1]) candidates.push(fenceMatch[1].trim());

    const firstBrace = source.indexOf("{");
    const lastBrace = source.lastIndexOf("}");
    if (firstBrace >= 0 && lastBrace > firstBrace) {
        candidates.push(source.slice(firstBrace, lastBrace + 1));
    }

    const firstBracket = source.indexOf("[");
    const lastBracket = source.lastIndexOf("]");
    if (firstBracket >= 0 && lastBracket > firstBracket) {
        candidates.push(source.slice(firstBracket, lastBracket + 1));
    }

    if (source.startsWith("{\"replies\":[") && !source.endsWith("]}")) {
        candidates.push(`${source}"]}`);
        candidates.push(`${source}]}`);
    }
    if (source.startsWith("[") && !source.endsWith("]")) {
        candidates.push(`${source}]`);
    }

    for (const candidate of candidates) {
        try {
            return JSON.parse(candidate);
        } catch (err) {
            try {
                const repaired = candidate
                    .replace(/,\s*([}\]])/g, "$1");
                return JSON.parse(repaired);
            } catch (repairErr) {
                // Try the next candidate.
            }
        }
    }

    return null;
}

function normalizeConversationReplyMap(payload, optionIds) {
    const ids = new Set(Array.isArray(optionIds) ? optionIds.map(id => String(id || "").trim()) : []);
    const replies = {};

    function collectFromArray(entries) {
        entries.forEach(entry => {
            if (!entry || typeof entry !== "object") return;
            const optionId = String(entry.id || entry.optionId || "").trim();
            const text = entry.reply || entry.text || entry.response || "";
            if (ids.has(optionId) && text) replies[optionId] = normalizeNPCReplyText(text);
        });
    }

    if (Array.isArray(payload)) {
        collectFromArray(payload);
        return replies;
    }

    if (payload && typeof payload === "object" && Array.isArray(payload.replies)) {
        collectFromArray(payload.replies);
        return replies;
    }

    const container = payload && typeof payload === "object"
        ? (payload.replies && payload.replies && !Array.isArray(payload.replies) && typeof payload.replies === "object"
            ? payload.replies
            : payload)
        : null;
    if (container && typeof container === "object") {
        Object.entries(container).forEach(([key, value]) => {
            const optionId = String(key || "").trim();
            if (!ids.has(optionId)) return;
            if (typeof value === "string") {
                replies[optionId] = normalizeNPCReplyText(value);
                return;
            }
            if (value && typeof value === "object") {
                const text = value.reply || value.text || value.response || "";
                if (text) replies[optionId] = normalizeNPCReplyText(text);
            }
        });
    }

    return replies;
}

function parseConversationReplyPayload(rawText, optionIds) {
    const parsed = tryParseConversationJSON(rawText);
    const normalized = normalizeConversationReplyMap(parsed, optionIds);
    if (Object.keys(normalized).length) return normalized;

    const ids = new Set(Array.isArray(optionIds) ? optionIds.map(id => String(id || "").trim()) : []);
    const replies = {};
    String(rawText || "").split(/\r?\n/).forEach(line => {
        const match = line.match(/^\s*(?:[-*]\s*)?\[?([a-z0-9-]+)\]?\s*[:=-]\s*(.+)\s*$/i);
        if (!match) return;
        const optionId = String(match[1] || "").trim();
        if (!ids.has(optionId)) return;
        replies[optionId] = normalizeNPCReplyText(match[2] || "");
    });
    return replies;
}

function getConversationRelationshipBand(npc) {
    const hostility = npc && typeof npc.hostility === "number" ? npc.hostility : 0;
    const favor = npc && npc.memory && typeof npc.memory.favorability === "number"
        ? npc.memory.favorability
        : 0;
    if (hostility >= 70) return "hostile";
    if (favor >= 30 && hostility <= 35) return "friendly";
    return "neutral";
}

function pickNPCConversationFallbackReply(npc, interaction) {
    const intentKey = String(interaction && interaction.intent || "talk").toLowerCase();
    const band = getConversationRelationshipBand(npc);
    const bucket = NPC_FALLBACK_REPLIES[intentKey] || NPC_FALLBACK_REPLIES.talk;
    const pool = bucket[band] || bucket.neutral || NPC_FALLBACK_REPLIES.talk.neutral;
    return pool[Math.floor(Math.random() * pool.length)];
}

function queueConversationPrefetch(npc, options) {
    if (!npc || !Array.isArray(options) || !options.length) return options;
    const room = G.activeRoom;
    const relevantOptions = options.filter(option => option && !option.action && (option.promptText || option.text));
    if (!relevantOptions.length) return options;

    const ctx = typeof getNPCConversationContext === "function"
        ? getNPCConversationContext(npc, { room })
        : null;
    const bundleKey = buildConversationBundleKey(npc, relevantOptions, room, ctx);
    const optionSnapshots = relevantOptions.map(option => {
        option._conversationBundleKey = bundleKey;
        option._conversationReplyKey = getConversationReplyKey(bundleKey, option.id);
        return {
            id: option.id,
            intent: option.intent || "talk",
            promptText: option.promptText || option.text || "",
            replyKey: option._conversationReplyKey
        };
    });

    const missingOptions = optionSnapshots.filter(option => !runtimeConversationState.replyCache[option.replyKey]);
    if (!missingOptions.length) return options;
    if (runtimeConversationState.bundlePromises[bundleKey]) return options;
    if (G.prefetchQueue.find(task => task && task.key === bundleKey)) return options;

    const prompt = buildPrompt(
        room,
        npc,
        buildConversationBatchInstruction(npc, relevantOptions, room),
        { includeRandomQuirk: false }
    );
    const optionIds = missingOptions.map(option => option.id);

    let resolveBundle;
    runtimeConversationState.bundlePromises[bundleKey] = new Promise(resolve => {
        resolveBundle = resolve;
    });

    enqueuePrefetchTask({
        key: bundleKey,
        priority: 100,
        run: async () => {
            const jsonPrefix = "{\"replies\":[";
            const result = await ai({
                instruction: prompt,
                startWith: jsonPrefix,
                endButtons: "none"
            });
            const continuation = typeof result === "string" ? result : result && result.text ? result.text : "";
            const rawText = String(continuation || "").trim().startsWith("{")
                ? String(continuation || "").trim()
                : `${jsonPrefix}${String(continuation || "").trim()}`;
            const replyMap = parseConversationReplyPayload(rawText, optionIds);
            let storedCount = 0;

            missingOptions.forEach(option => {
                if (replyMap[option.id]) {
                    storeCachedConversationReply(npc, option, replyMap[option.id]);
                    storedCount += 1;
                }
            });

            if (storedCount > 0) {
                console.log(`Conversation prefetch cached ${storedCount}/${missingOptions.length} replies for ${npc.name || "NPC"}.`);
            }
            if (!Object.keys(replyMap).length) {
                console.warn("Conversation prefetch returned no parseable replies:", rawText.slice(0, 400));
            }
        },
        finalize: () => {
            delete runtimeConversationState.bundlePromises[bundleKey];
            if (resolveBundle) resolveBundle();
        }
    });

    runPrefetchQueue();
    return options;
}

async function waitForConversationReply(replyKey, bundleKey, waitMs = CONVERSATION_PREFETCH_GRACE_MS) {
    if (replyKey && runtimeConversationState.replyCache[replyKey]) {
        return runtimeConversationState.replyCache[replyKey];
    }

    const pending = bundleKey ? runtimeConversationState.bundlePromises[bundleKey] : null;
    if (!pending) return "";

    await Promise.race([
        pending,
        new Promise(resolve => setTimeout(resolve, waitMs))
    ]);

    return replyKey ? (runtimeConversationState.replyCache[replyKey] || "") : "";
}

function rememberNPCConversationLine(npc, speaker, text, intent = "talk") {
    if (!npc || !text) return;
    if (typeof ensureNPCRelationshipState === "function") ensureNPCRelationshipState(npc);
    npc.memory.recentLines.push({
        speaker,
        intent,
        text: String(text).replace(/\s+/g, " ").trim(),
        timestamp: Date.now()
    });
    npc.memory.recentLines = npc.memory.recentLines.slice(-6);
}

function normalizeNPCReplyText(text) {
    return String(text || "")
        .replace(/[“”]/g, "\"")
        .replace(/[‘’]/g, "'")
        .replace(/\s+/g, " ")
        .trim();
}

async function npcRespond(npc, interaction) {
    if (!canConverseWithNPC(npc)) {
        clearChatOptions();
        return;
    }

    const room = G.activeRoom;
    const playerInput = typeof interaction === "string"
        ? interaction
        : (interaction && (interaction.promptText || interaction.text) ? (interaction.promptText || interaction.text) : "");
    const intent = interaction && interaction.intent ? interaction.intent : "talk";
    let responseText = "";
    const choice = interaction && typeof interaction === "object"
        ? interaction
        : { text: playerInput, promptText: playerInput, intent };

    // If this choice came from the rendered talk menu, it already carries the
    // batch key/reply key from that menu's JSON prefetch. Do not overwrite it.
    if (!choice.action && !choice._conversationBundleKey) {
        queueConversationPrefetch(npc, [choice]);
    }

    responseText = getCachedConversationReply(npc, choice);
    if (!responseText) {
        addTypingIndicator();
        responseText = await waitForConversationReply(choice._conversationReplyKey, choice._conversationBundleKey);
        removeTypingIndicator();
    }

    if (!responseText) {
        responseText = pickNPCConversationFallbackReply(npc, choice);
        if (choice._conversationBundleKey) {
            waitForConversationReply(choice._conversationReplyKey, choice._conversationBundleKey, 1200)
                .catch(() => "");
        }
        try {
            const prompt = buildPrompt(
                room,
                npc,
                buildSingleConversationInstruction(npc, choice, room),
                { includeRandomQuirk: false }
            );
            ai({ instruction: prompt, endButtons: "none" })
                .then(result => {
                    const lateReply = normalizeNPCReplyText(typeof result === "string" ? result : result && result.text ? result.text : "");
                    if (lateReply && !getCachedConversationReply(npc, choice)) {
                        storeCachedConversationReply(npc, choice, lateReply);
                    }
                })
                .catch(err => console.warn("Late NPC reply generation failed:", err));
        } catch (err) {
            console.warn("Unable to queue late NPC reply generation:", err);
        }
    }

    addChatMessage("left", npc.name, responseText, { mode: "spoken" });
    updateStoryOnNpcInteraction(npc, playerInput, responseText);

    if (typeof ensureNPCRelationshipState === "function") ensureNPCRelationshipState(npc);
    npc.memory.metPlayer = true;
    npc.memory.lastSpokenTo = Date.now();
    rememberNPCConversationLine(npc, "player", playerInput, intent);
    rememberNPCConversationLine(npc, "npc", responseText, intent);
    if (typeof generateNPCBehavior === "function") npc.behavior = generateNPCBehavior(npc);
    if (G.activeNPC === npc && typeof refreshNPCDetailPanel === "function") {
        refreshNPCDetailPanel(npc);
    }

    saveGameState();

    if (G.activeNPC === npc) {
        G.activeNPCMode = "talk";
        renderChatOptions(npc);
    }
}
