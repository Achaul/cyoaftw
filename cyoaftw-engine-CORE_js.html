<script>
// ── GAME STATE ───────────────────────────────────────────────────

window.G = {
    player: {
        name: "Adventurer",
        class: "Fighter",
        hp: 20,
        hpMax: 20,
        armor: 10,
        attackBonus: 1,
        weapon: "Short sword",
        coins: 10,
        inventory: [],
        equipped: {},
        coords: "0,0"
    },
    roomMap: {},
    activeRoom: null,
    activeNPC: null,
    activeObject: null,
    activeNPCMode: null,
    story: createStoryDirectorState(),
    prefetchCache: {},
    prefetchQueue: [],
    isPrefetching: false
};

// ── SETUP STATE (window scope for onclick access) ─────────────────

window.setupStats = {
    physicalProwess: 3,
    flexibility: 3,
    willpower: 3,
    endurance: 3,
    charisma: 3,
    pointsLeft: 6
};

window.playerTraits = {};

// ── HELPERS ──────────────────────────────────────────────────────

function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function getRoom(coords) { return G.roomMap[coords] || null; }
function setRoom(coords, room) { G.roomMap[coords] = room; }

const FALLBACK_HUMANOID_SPECIES = ["human", "elf", "dwarf", "halfling", "goblin", "orc"];
const FALLBACK_NON_HUMANOID_SPECIES = ["skeleton", "rat", "ghost"];

function normalizeSpeciesName(species) {
    return String(species || "").toLowerCase();
}

function getSpeciesHumanoidFlag(species) {
    const template = typeof getSpeciesTemplate === "function"
        ? getSpeciesTemplate(species)
        : null;

    if (template && typeof template.isHumanoid === "boolean") {
        return template.isHumanoid;
    }

    const speciesName = normalizeSpeciesName(species);
    if (FALLBACK_HUMANOID_SPECIES.includes(speciesName)) return true;
    if (FALLBACK_NON_HUMANOID_SPECIES.includes(speciesName)) return false;

    return null;
}

function hydrateNPCSpeciesFlags(npc) {
    if (!npc) return npc;
    const humanoidFlag = getSpeciesHumanoidFlag(npc.species);

    if (typeof humanoidFlag === "boolean") {
        npc.isHumanoid = humanoidFlag;
    }

    return npc;
}

function canConverseWithNPC(npc) {
    if (!npc || npc.unconscious || npc.isUnconsciousBody || npc.hidden || npc.isHidden) return false;
    hydrateNPCSpeciesFlags(npc);

    const humanoidFlag = getSpeciesHumanoidFlag(npc.species);
    if (typeof humanoidFlag === "boolean") return humanoidFlag;

    if (typeof npc.isHumanoid === "boolean") {
        return npc.isHumanoid;
    }

    return false;
}

const TRADE_GOODS = [
    { id: "ration",      name: "Ration",      value: 2 },
    { id: "torch",       name: "Torch",       value: 1 },
    { id: "bandage",     name: "Bandage",     value: 3 },
    { id: "rope",        name: "Rope",        value: 5 },
    { id: "lockpick",    name: "Lockpick",    value: 8 },
    { id: "healing-herb", name: "Healing herb", value: 6 }
];

function getCoinValue(entity) {
    if (!entity) return 0;
    if (typeof entity.coins === "number") return Math.max(0, entity.coins);

    const equipped = entity.equipped || {};
    const pouch = equipped.coinPouch;
    if (pouch && typeof pouch.value === "number") return Math.max(0, pouch.value);

    return 0;
}

function adjustCoins(entity, delta) {
    if (!entity || typeof delta !== "number") return false;

    const nextValue = Math.max(0, getCoinValue(entity) + delta);
    if (typeof entity.coins === "number" || !entity.equipped || !entity.equipped.coinPouch) {
        entity.coins = nextValue;
        return true;
    }

    entity.equipped.coinPouch.value = nextValue;
    return true;
}

function hasEnoughCoins(entity, amount) {
    return getCoinValue(entity) >= Math.max(0, amount || 0);
}

function getTemperamentModifier(temperament) {
    const key = String(temperament || "neutral").toLowerCase();
    const modifiers = {
        aggressive: -6,
        hostile: -4,
        skittish: -2,
        wary: -1,
        neutral: 0,
        bold: 1,
        curious: 2,
        calm: 4,
        friendly: 6
    };

    return typeof modifiers[key] === "number" ? modifiers[key] : 0;
}

function showTradeMessage(text, success) {
    const msgBox = document.getElementById("tradeFeedback");
    if (msgBox) {
        msgBox.textContent = text || "";
        msgBox.style.color = success ? "#9f9" : "#f88";
    }

    if (text) setNarration(text);
}

function isTradeAccepted(playerTotal, npcTotal, npc) {
    if (playerTotal >= npcTotal) return true;

    const d20 = randInt(1, 20);
    const temperamentMod = getTemperamentModifier(npc ? npc.temperament : "neutral");
    const margin = d20 + temperamentMod;
    const adjustedAsk = Math.max(0, npcTotal - margin);
    const accepted = playerTotal >= adjustedAsk;

    if (npc) {
        if (!npc.memory) npc.memory = {};
        npc.memory.lastTradeCheck = {
            playerTotal,
            npcTotal,
            d20,
            temperamentMod,
            adjustedAsk,
            accepted
        };
    }

    return accepted;
}

const ROOM_DIRECTIONS = ["N","S","E","W","NE","NW","SE","SW"];
const OPPOSITE_DIRECTIONS = {
    N: "S", S: "N",
    E: "W", W: "E",
    NE: "SW", SW: "NE",
    NW: "SE", SE: "NW"
};
const DIRECTION_ALIASES = {
    NORTH: "N",
    SOUTH: "S",
    EAST: "E",
    WEST: "W",
    NORTHEAST: "NE",
    NORTHWEST: "NW",
    SOUTHEAST: "SE",
    SOUTHWEST: "SW"
};

function normalizeDirection(direction) {
    const value = String(direction || "").toUpperCase();
    if (OPPOSITE_DIRECTIONS[value]) return value;
    return DIRECTION_ALIASES[value] || null;
}

function oppositeDirection(direction) {
    const dir = normalizeDirection(direction);
    return dir ? OPPOSITE_DIRECTIONS[dir] : null;
}

function parseCoords(coords) {
    if (typeof coords !== "string") return null;

    const parts = coords.split(",");
    if (parts.length !== 2) return null;

    const x = Number(parts[0]);
    const y = Number(parts[1]);
    if (!isFinite(x) || !isFinite(y)) return null;

    return {
        x,
        y,
        key: `${x},${y}`
    };
}

function getAdjacentCoords(coords, direction) {
    const origin = parseCoords(coords);
    const dir = normalizeDirection(direction);
    if (!origin || !dir) return null;

    const off = dirToOffset(dir);
    return `${origin.x + off.x},${origin.y + off.y}`;
}

function getBuildableRoomTypesForZone(zoneName) {
    const zoneTemplate = getZoneTemplate(zoneName);
    const roomTypes = zoneTemplate && Array.isArray(zoneTemplate.roomTypes)
        ? zoneTemplate.roomTypes
        : [];

    return roomTypes.filter(roomType => !!getRoomTemplate(roomType));
}

function chooseRoomTypeForZone(zoneName, fallbackRoomType) {
    const buildableTypes = getBuildableRoomTypesForZone(zoneName);
    if (buildableTypes.length > 0) return rand(buildableTypes);

    if (fallbackRoomType && getRoomTemplate(fallbackRoomType)) {
        return fallbackRoomType;
    }

    if (getRoomTemplate("Street")) return "Street";
    if (getRoomTemplate("Corridor")) return "Corridor";
    return fallbackRoomType || "Street";
}

function ensureRoomExits(room) {
    if (!room) return null;

    if (!room.exits || typeof room.exits !== "object" || Array.isArray(room.exits)) {
        room.exits = {};
    }

    return room.exits;
}

function setRoomExit(room, direction, targetCoords) {
    const exits = ensureRoomExits(room);
    const dir = normalizeDirection(direction);
    const target = parseCoords(targetCoords);
    if (!exits || !dir || !target) return false;

    if (exits[dir] === target.key) return false;
    exits[dir] = target.key;
    return true;
}

function repairRoomExits(room) {
    if (!room) return false;

    const origin = parseCoords(room.coords);
    const exits = ensureRoomExits(room);
    let changed = false;

    if (!origin || !exits) return changed;

    Object.keys(exits).forEach(originalDir => {
        const dir = normalizeDirection(originalDir);
        const target = parseCoords(exits[originalDir]);

        if (!dir || !target) {
            delete exits[originalDir];
            changed = true;
            return;
        }

        const expectedCoords = getAdjacentCoords(origin.key, dir);
        if (target.key !== expectedCoords) {
            delete exits[originalDir];
            changed = true;
            return;
        }

        if (originalDir !== dir) {
            delete exits[originalDir];
            exits[dir] = target.key;
            changed = true;
            return;
        }

        if (exits[dir] !== target.key) {
            exits[dir] = target.key;
            changed = true;
        }
    });

    return changed;
}

function repairRoomMapExits() {
    if (!G.roomMap || typeof G.roomMap !== "object") {
        G.roomMap = {};
        return true;
    }

    let changed = false;
    const coordsList = Object.keys(G.roomMap);

    coordsList.forEach(coords => {
        const room = G.roomMap[coords];
        const parsed = parseCoords(coords);

        if (!room || !parsed) return;

        if (room.coords !== parsed.key) {
            room.coords = parsed.key;
            changed = true;
        }

        if (repairRoomExits(room)) changed = true;
    });

    coordsList.forEach(coords => {
        const room = G.roomMap[coords];
        if (!room) return;

        Object.keys(room.exits || {}).forEach(dir => {
            const targetCoords = room.exits[dir];
            const targetRoom = G.roomMap[targetCoords];
            const backDir = oppositeDirection(dir);

            if (!targetRoom || !backDir) return;
            if (setRoomExit(targetRoom, backDir, coords)) changed = true;
        });
    });

    return changed;
}

// ── STORY DIRECTOR ───────────────────────────────────────────────

function createStoryDirectorState() {
    return {
        act: 1,
        tension: 15,
        activeThreads: [],
        discoveredFacts: [],
        recentEvents: [],
        unresolvedQuestions: []
    };
}

function clampStoryTension(value) {
    return Math.max(0, Math.min(100, value));
}

function rememberStoryEvent(type, text, weight) {
    if (!G.story) G.story = createStoryDirectorState();
    if (typeof weight !== "number") weight = 0;

    G.story.recentEvents.unshift({
        type,
        text,
        room: G.activeRoom ? (G.activeRoom.displayName || G.activeRoom.name || null) : null,
        turn: Date.now()
    });

    G.story.recentEvents = G.story.recentEvents.slice(0, 8);
    G.story.tension = clampStoryTension((G.story.tension || 0) + weight);
}

function addStoryFact(text) {
    if (!G.story) G.story = createStoryDirectorState();
    if (!text || G.story.discoveredFacts.includes(text)) return;
    G.story.discoveredFacts.push(text);
    G.story.discoveredFacts = G.story.discoveredFacts.slice(-12);
}

function addStoryQuestion(text) {
    if (!G.story) G.story = createStoryDirectorState();
    if (!text || G.story.unresolvedQuestions.includes(text)) return;
    G.story.unresolvedQuestions.push(text);
    G.story.unresolvedQuestions = G.story.unresolvedQuestions.slice(-8);
}

function ensureStoryThread(seed) {
    if (!G.story) G.story = createStoryDirectorState();
    if (!seed || !seed.id) return null;

    let thread = G.story.activeThreads.find(t => t.id === seed.id);
    if (!thread) {
        thread = {
            id: seed.id,
            title: seed.title,
            status: "active",
            intensity: seed.intensity || 20,
            beats: []
        };
        G.story.activeThreads.push(thread);
    }

    return thread;
}

function addStoryBeat(threadId, text, intensityDelta) {
    if (typeof intensityDelta !== "number") intensityDelta = 0;

    const thread = ensureStoryThread({
        id: threadId,
        title: threadId.split("-").map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ")
    });
    if (!thread || !text) return;

    thread.beats.push({
        text,
        room: G.activeRoom ? (G.activeRoom.displayName || G.activeRoom.name || null) : null,
        turn: Date.now()
    });
    thread.beats = thread.beats.slice(-6);
    thread.intensity = clampStoryTension((thread.intensity || 0) + intensityDelta);
}

function updateStoryOnAdventureStart(zone, roomType) {
    G.story = createStoryDirectorState();

    const title = `${zone} Rumblings`;
    ensureStoryThread({
        id: `local-${String(zone).toLowerCase()}`,
        title,
        intensity: 20
    });

    addStoryFact(`${G.player.name} began their adventure in ${zone}.`);
    addStoryQuestion(`What is unsettled beneath the ordinary life of ${zone}?`);
    rememberStoryEvent("start", `The adventure began in ${roomType}.`, 5);
}

function updateStoryOnRoomEntered(room, direction) {
    if (!room) return;

    const danger = deriveRoomContext(room).danger;
    const roomName = room.displayName || room.name || room.type || "an unknown place";
    const hasNPCs = Array.isArray(room.creatures) && room.creatures.length > 0;

    let weight = danger === "hostile" ? 12 : danger === "tense" ? 6 : -1;
    if (hasNPCs) weight += 2;

    rememberStoryEvent("movement", `${G.player.name} moved ${direction} into ${roomName}.`, weight);

    if (danger === "hostile") {
        addStoryQuestion(`What danger is waiting in ${roomName}?`);
        addStoryBeat("local-danger", `${roomName} felt dangerous.`, 8);
    } else if (hasNPCs) {
        addStoryBeat("local-encounters", `${roomName} held someone worth noticing.`, 3);
    }

    if ((G.story.tension || 0) >= 70 && G.story.act < 2) {
        G.story.act = 2;
        rememberStoryEvent("act-shift", "The story pressure rose into a more dangerous phase.", 0);
    }
}

function updateStoryOnNpcInteraction(npc, playerInput, responseText) {
    if (!npc) return;

    const npcName = npc.name || "Someone";
    const summary = `${G.player.name} spoke with ${npcName}: "${playerInput.slice(0, 80)}"`;
    rememberStoryEvent("conversation", summary, 2);

    if (!npc.memory.metPlayer) {
        addStoryFact(`${G.player.name} met ${npcName}.`);
        addStoryBeat("local-encounters", `${npcName} entered the story.`, 4);
    }

    const lowerInput = playerInput.toLowerCase();
    const lowerResponse = String(responseText || "").toLowerCase();
    if (lowerInput.includes("rumor") || lowerInput.includes("secret") || lowerResponse.includes("secret")) {
        addStoryQuestion(`What does ${npcName} know that has not been said plainly?`);
        addStoryBeat("local-rumors", `${npcName} hinted that there may be more to learn.`, 6);
    }
}

// ── SETUP FLOW ───────────────────────────────────────────────────

function setupGoTo(page) {
    document.querySelectorAll(".setup-page").forEach(p => p.classList.remove("active"));
    document.getElementById(`setupPage${page}`).classList.add("active");
}

function randomizeName() {
    const names = [
        "Aldric","Mira","Cael","Soren","Lyra","Thane",
        "Vessa","Edric","Nori","Brynn","Gareth","Isolde"
    ];
    document.getElementById("charNameEl").value = names[Math.floor(Math.random() * names.length)];
}

function changeStat(stat, delta) {
    const next = window.setupStats[stat] + delta;
    if (next < 1 || next > 7) return;
    if (delta > 0 && window.setupStats.pointsLeft <= 0) return;
    window.setupStats[stat] = next;
    window.setupStats.pointsLeft -= delta;
    document.getElementById(`sv-${stat}`).textContent = next;
    document.getElementById("statPointsLeftEl").textContent = window.setupStats.pointsLeft;
}

function selectPersonality(btn) {
    const question = btn.closest(".personality-question");
    question.querySelectorAll(".personality-btn").forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
    const trait = btn.dataset.trait;
    window.playerTraits[trait] = (window.playerTraits[trait] || 0) + 1;
}

function beginAdventure() {
    const name   = document.getElementById("charNameEl").value.trim() || "Adventurer";
    const cls    = document.getElementById("charClassEl").value;
    const gender = document.getElementById("charGenderEl").value;
    const zone   = document.getElementById("worldSelectEl").value;
    const room   = document.getElementById("startRoomSelectEl").value;

    const hpByClass  = { Fighter: 20, Rogue: 16, Cleric: 18, Wizard: 14 };
    const atkByClass = { Fighter: 3,  Rogue: 2,  Cleric: 1,  Wizard: 1  };

    G.player = {
        name, class: cls, gender,
        hp:          hpByClass[cls]  || 16,
        hpMax:       hpByClass[cls]  || 16,
        armor:       10,
        attackBonus: atkByClass[cls] || 1,
        weapon:      cls === "Fighter" ? "Short sword"
                   : cls === "Rogue"   ? "Dagger"
                   : cls === "Wizard"  ? "Staff"
                   : "Mace",
        coins:     10,
        inventory: [],
        equipped:  {},
        coords:    "0,0",
        traits:    window.playerTraits,
        stats:     { ...window.setupStats }
    };

    document.getElementById("setupWrapper").style.display = "none";
    document.getElementById("gameWrapper").classList.add("active");

    showSpinner("Preparing your adventure...");
    G.activeRoom = getOrCreateRoom("0,0", zone, room);
    G.activeNPC = null;
    G.activeNPCMode = null;
    repairRoomMapExits();
    updateStoryOnAdventureStart(zone, room);
    hideSpinner();

    renderRoom();
    renderStats();
    schedulePrefetch();

    renderRoomNarration(G.activeRoom, "start", null);

    saveGameState();
}

// 

// ── SAVE / LOAD HELPERS ──────────────────────────────────────────

const SAVE_KEY = "cyoaftwSave";

function isValidSavedGame(save) {
    return !!(
        save &&
        save.version === 1 &&
        save.player &&
        save.roomMap &&
        save.player.coords &&
        save.roomMap[save.player.coords]
    );
}

function readSavedGame() {
    try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return null;

        const save = JSON.parse(raw);
        if (!isValidSavedGame(save)) return null;
        return save;

    } catch (err) {
        console.warn("Saved game read failed:", err);
        return null;
    }
}

function hasSavedGame() {
    return !!readSavedGame();
}

function formatSavedAt(savedAt) {
    if (!savedAt) return "unknown time";

    const date = new Date(savedAt);
    if (isNaN(date.getTime())) return "unknown time";

    return date.toLocaleString();
}

function escapeHtml(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
}

function getSavedGameSummary(save) {
    const player = save.player || {};
    const room = save.roomMap[player.coords] || {};
    const location = room.displayName || room.name || room.type || player.coords || "unknown location";
    const zone = room.zone ? `${room.zone} - ` : "";
    const savedAt = save.meta ? save.meta.savedAt : null;

    return `${escapeHtml(player.name || "Adventurer")} the ${escapeHtml(player.class || "Adventurer")}<br>` +
        `${escapeHtml(zone)}${escapeHtml(location)}<br>` +
        `Saved ${escapeHtml(formatSavedAt(savedAt))}`;
}

function showSavedGamePrompt() {
    const promptEl = document.getElementById("savedGamePrompt");
    const setupEl = document.getElementById("setupWrapper");
    const summaryEl = document.getElementById("savedGameSummaryEl");
    if (!promptEl || !setupEl || !summaryEl) return;

    const save = readSavedGame();
    if (!save) {
        hideSavedGamePrompt();
        return;
    }

    summaryEl.innerHTML = getSavedGameSummary(save);
    promptEl.classList.add("active");
    setupEl.classList.add("save-prompt-active");
}

function hideSavedGamePrompt() {
    const promptEl = document.getElementById("savedGamePrompt");
    const setupEl = document.getElementById("setupWrapper");

    if (promptEl) promptEl.classList.remove("active");
    if (setupEl) setupEl.classList.remove("save-prompt-active");
}

function clearSavedGame() {
    try {
        localStorage.removeItem(SAVE_KEY);
        return true;
    } catch (err) {
        console.warn("Saved game clear failed:", err);
        return false;
    }
}

function showSetupScreen() {
    const setupEl = document.getElementById("setupWrapper");
    const gameEl = document.getElementById("gameWrapper");

    if (setupEl) setupEl.style.display = "flex";
    if (gameEl) gameEl.classList.remove("active");
}

function showGameScreen() {
    const setupEl = document.getElementById("setupWrapper");
    const gameEl = document.getElementById("gameWrapper");

    if (setupEl) setupEl.style.display = "none";
    if (gameEl) gameEl.classList.add("active");
}

function startNewAdventureFromPrompt() {
    clearSavedGame();
    hideSavedGamePrompt();
    setupGoTo(1);
}

function resetNpcPanel() {
    const placeholderEl = document.getElementById("npcPlaceholderEl");
    const detailEl = document.getElementById("npcDetailEl");

    if (placeholderEl) placeholderEl.style.display = "block";
    if (detailEl) detailEl.classList.remove("active");
    G.activeObject = null;
    G.activeNPCMode = null;
    clearChatOptions();
    setExitGridVisible(true);
}

function resumeSavedGame() {
    const save = readSavedGame();
    if (!save) {
        hideSavedGamePrompt();
        showSetupScreen();
        return false;
    }

    G.player = save.player;
    G.roomMap = save.roomMap || {};
    G.story = save.story || createStoryDirectorState();
    repairRoomMapExits();
    G.activeRoom = G.roomMap[G.player.coords] || null;
    G.activeNPC = null;
    G.activeNPCMode = null;
    G.prefetchCache = {};
    G.prefetchQueue = [];
    G.isPrefetching = false;

    if (!G.activeRoom) {
        console.warn("Saved game is missing the active room.");
        clearSavedGame();
        hideSavedGamePrompt();
        showSetupScreen();
        return false;
    }

    const activeNPCId = save.meta ? save.meta.activeNPCId : null;
    if (activeNPCId && Array.isArray(G.activeRoom.creatures)) {
        for (let i = 0; i < G.activeRoom.creatures.length; i++) {
            if (G.activeRoom.creatures[i].id === activeNPCId) {
                hydrateNPCSpeciesFlags(G.activeRoom.creatures[i]);
                G.activeNPC = G.activeRoom.creatures[i];
                break;
            }
        }
    }

    showGameScreen();

    clearChatLog();

    renderRoom();
    renderStats();

    if (G.activeNPC) {
        selectNPC(G.activeNPC);
    } else {
        resetNpcPanel();
    }

    schedulePrefetch();

    renderRoomNarration(G.activeRoom, "resume", null);

    saveGameState();
    return true;
}

function initSavedGamePrompt() {
    showSetupScreen();
    if (hasSavedGame()) {
        showSavedGamePrompt();
    } else {
        hideSavedGamePrompt();
    }
}

if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initSavedGamePrompt);
} else {
    initSavedGamePrompt();
}

function saveGameState() {
    try {
        repairRoomMapExits();

        const saveData = {
            version: 1,

            player: G.player,

            roomMap: G.roomMap,

            story: G.story,

            meta: {
                savedAt: Date.now(),
                activeNPCId: G.activeNPC ? G.activeNPC.id : null
            }
        };

        localStorage.setItem(
            SAVE_KEY,
            JSON.stringify(saveData)
        );

        console.log("Game saved.");
        return true;

    } catch (err) {
        console.error("Save failed:", err);
        return false;
    }
}



// ── ROOM GENERATION ──────────────────────────────────────────────

function getOrCreateRoom(coords, zoneName, roomType) {
    const parsed = parseCoords(coords);
    if (!parsed) return null;

    if (G.roomMap[parsed.key]) {
        repairRoomExits(G.roomMap[parsed.key]);
        return G.roomMap[parsed.key];
    }

    const buildRoomType = getRoomTemplate(roomType)
        ? roomType
        : chooseRoomTypeForZone(zoneName, "Street");
    const room = buildRoomInstance(buildRoomType, zoneName);
    if (!room) return null;

    room.coords  = parsed.key;
    room.exits   = generateExits(parsed.key, zoneName);
    room.creatures = spawnNPCsForRoom(room, zoneName);

    repairRoomExits(room);
    setRoom(parsed.key, room);
    return room;
}

function generateExits(coords, zoneName) {
    const origin = parseCoords(coords);
    const exits = {};
    if (!origin) return exits;

    const count = randInt(1, 3);
    const shuffled = ROOM_DIRECTIONS.slice().sort(() => Math.random() - 0.5);
    for (let i = 0; i < count; i++) {
        const dir = shuffled[i];
        exits[dir] = getAdjacentCoords(origin.key, dir);
    }
    return exits;
}

function dirToOffset(dir) {
    const map = {
        N:  { x:  0, y:  1 }, S:  { x:  0, y: -1 },
        E:  { x:  1, y:  0 }, W:  { x: -1, y:  0 },
        NE: { x:  1, y:  1 }, NW: { x: -1, y:  1 },
        SE: { x:  1, y: -1 }, SW: { x: -1, y: -1 }
    };
    return map[dir] || { x: 0, y: 0 };
}

// ── NPC SPAWNING ─────────────────────────────────────────────────

function spawnNPCsForRoom(room, zoneName) {
    const npcs = [];
    if (room.role === "spine") return npcs;

    const zone = getZoneTemplate(zoneName);
    if (!zone) return npcs;

    const count = room.role === "landmark" ? randInt(1, 3) : randInt(0, 2);
    for (let i = 0; i < count; i++) {
        const species = rand(zone.allowedSpecies);
        const npc = createNPC(species, room, zone);
        if (npc) npcs.push(npc);
    }
    return npcs;
}

function createNPC(species, room, zoneTemplate) {
    const isHumanoid = getSpeciesHumanoidFlag(species) === true;
    const profile     = getRandomPersonalityProfile({});
    const ageCategory = getAgeCategoryForRole("Wanderer", profile.archetype);
    const age         = isHumanoid ? getRandomAge(ageCategory) : null;
    const gender      = isHumanoid ? (Math.random() < 0.5 ? "male" : "female") : "none";
    const temperament = profile.temperament;

    const npc = {
        id:               `${species.toLowerCase()}-${Math.random().toString(36).slice(2, 7)}`,
        name:             isHumanoid ? `${gender === "male" ? "a male" : "a female"} ${species}` : `a ${species}`,
        species,
        isHumanoid,
        gender,
        role:             "Wanderer",
        temperament,
        hostility:        temperament === "hostile" ? randInt(60, 90) : randInt(0, 40),
        age,
        ageCategory,
        personalityProfile: profile,
        personalityTraits:  profile.traits,
        speechStyle:        profile.speechStyle,
        hp: 10, hpMax: 10,
        inventory: [],
        equipped:  {},
        memory: {
            metPlayer:       false,
            favorability:    temperament === "hostile" ? -40 : 0,
            lastMood:        "neutral",
            playerActions:   [],
            aggressionCount: 0
        }
    };

    if (typeof generateNPCEnrichment === "function") {
        generateNPCEnrichment(npc, room, zoneTemplate);
    }

    npc.action   = generatePostureOrAction(temperament);
    npc.behavior = generateNPCBehavior(npc);
    return npc;
}

// ── MOVEMENT ─────────────────────────────────────────────────────

function movePlayer(direction) {
    const dir = normalizeDirection(direction);
    const room = G.activeRoom;
    if (!room || !dir) return;

    if (!room.coords && G.player && G.player.coords) room.coords = G.player.coords;
    repairRoomExits(room);

    const target = parseCoords(room.exits[dir]);
    const expectedCoords = getAdjacentCoords(room.coords, dir);
    if (!target || target.key !== expectedCoords) {
        if (room.exits) delete room.exits[dir];
        renderRoom();
        saveGameState();
        console.warn("Removed invalid exit", dir, "from", room.coords);
        return;
    }

    const newCoords    = target.key;
    const zone         = G.activeRoom.zone || "Town";
    const roomType     = chooseRoomTypeForZone(zone, "Street");

    const newRoom = getOrCreateRoom(newCoords, zone, roomType);
    if (!newRoom) {
        delete room.exits[dir];
        renderRoom();
        saveGameState();
        console.warn("Room creation failed for", newCoords);
        return;
    }

    setRoomExit(newRoom, oppositeDirection(dir), room.coords);
    repairRoomMapExits();

    G.player.coords = newCoords;
    G.activeRoom = newRoom;
    G.activeNPC  = null;
    G.activeNPCMode = null;
    updateStoryOnRoomEntered(newRoom, dir);

    clearChatLog();
    renderRoom();
    schedulePrefetch();

    renderRoomNarration(G.activeRoom, "move", dir);

    saveGameState();
}

// ── PREFETCH ─────────────────────────────────────────────────────

function schedulePrefetch() {
    const room = G.activeRoom;
    if (!room) return;

    Object.entries(room.exits).forEach(([dir, coords]) => {
        const key = `desc:${coords}`;
        if (G.prefetchCache[key]) return;
        if (G.prefetchQueue.find(t => t.key === key)) return;

        G.prefetchQueue.push({
            key,
            build: () => {
                const z  = room.zone || "Town";
                const rt = chooseRoomTypeForZone(z, "Street");
                const pr = buildRoomInstance(rt, z);
                return buildPrompt(pr, null,
                    "Write 1 sentence of atmospheric description for this location. Be vivid and brief."
                );
            }
        });
    });

    runPrefetchQueue();
}

async function runPrefetchQueue() {
    if (G.isPrefetching || G.prefetchQueue.length === 0) return;
    G.isPrefetching = true;

    const task = G.prefetchQueue.shift();
    try {
        const prompt = task.build();
        const result = await ai({ instruction: prompt, endButtons: "none" });
        G.prefetchCache[task.key] = result.text || result;
    } catch(e) {
        console.warn("Prefetch failed:", task.key, e);
    }

    G.isPrefetching = false;
    if (G.prefetchQueue.length > 0) setTimeout(runPrefetchQueue, 800);
}

// ── NPC INTERACTION ──────────────────────────────────────────────

async function npcRespond(npc, playerInput) {
    if (!canConverseWithNPC(npc)) {
        clearChatOptions();
        return;
    }

    const room = G.activeRoom;

    const instruction = `
You are ${npc.name}, a ${npc.species} in this location.
The player says: "${playerInput}"
Respond in character. Stay brief — 2 to 4 sentences.
Do not break character. Do not refer to yourself as an AI.
Speak only as ${npc.name} would speak.
    `.trim();

    const prompt = buildPrompt(room, npc, instruction);

    addTypingIndicator();

    let responseText = "";
    try {
        const result = await ai({ instruction: prompt, endButtons: "none" });
        responseText = typeof result === "string" ? result : result.text || "";
    } catch (err) {
        console.error("NPC response failed:", err);
        responseText = `${npc.name} hesitates, unable to answer just now.`;
    }

    removeTypingIndicator();

    addChatMessage("left", npc.name, responseText);
    updateStoryOnNpcInteraction(npc, playerInput, responseText);

    npc.memory.metPlayer = true;
    npc.memory.lastMood  = "neutral";
    npc.memory.playerActions.push(playerInput.slice(0, 60));

    saveGameState();

    if (G.activeNPC === npc) {
        G.activeNPCMode = "talk";
        renderChatOptions(npc);
    }
}

function getChatOptions(npc) {
    if (!canConverseWithNPC(npc)) return [];

    const favor = npc && npc.memory && typeof npc.memory.favorability === "number"
        ? npc.memory.favorability : 0;
    const hostility = npc && typeof npc.hostility === "number" ? npc.hostility : 0;

    const options = [
        { label: "Greet them", text: "I greet them and wait to see how they respond." },
        { label: "Ask about this place", text: "What can you tell me about this place?" },
        { label: "Ask what they have seen", text: "Have you seen anything unusual nearby?" },
        { label: "Offer help", text: "You look like you might need help. What is going on?" }

    if (hostility >= 60 || favor < -20) {
        options.push({
            label: "Keep things calm",

        });
    } else {
        options.push({
            label: "Ask for a rumor",
            text: "Have you heard any rumors or secrets worth knowing?"
        });
    }

    options.push({
        label: "Say goodbye",
        text: "I say goodbye and step away.",

// -- COMBAT ---------------------------------------------------------------

const COMBAT_ATTACK_STYLES = {
    quick: {
        label: "Quick",
        hitBonus: 3,
        damageBonus: -1,
        incomingBonus: -1,
        text: "You press with a fast, controlled strike."
    },
    balanced: {
        label: "Balanced",
        hitBonus: 1,
        damageBonus: 0,
        incomingBonus: 0,
        text: "You commit to a measured attack."
    },
    heavy: {
        label: "Heavy",
        hitBonus: -2,
        damageBonus: 3,
        incomingBonus: 2,
        text: "You put your weight behind a heavy blow."
    },
    precise: {
        label: "Precise",
        hitBonus: -1,
        damageBonus: 0,
        incomingBonus: 0,
        text: "You wait for a cleaner opening."
    }
};

const COMBAT_TARGETS = {
    torso: { label: "Torso", hitMod: 0, damageMod: 1, limbKey: "torso" },
    head:  { label: "Head",  hitMod: 4, damageMod: 1, limbKey: "head" },
    arms:  { label: "Arms",  hitMod: 2, damageMod: 0, limbKey: "arms" },
    legs:  { label: "Legs",  hitMod: 2, damageMod: 0, limbKey: "legs" }
};

function ensureCombatState(entity) {
    if (!entity) return null;
    entity.combatState = entity.combatState || {};
    entity.combatState.limbs = entity.combatState.limbs || {};

    const maxHp = Math.max(1, entity.hpMax || entity.maxHp || entity.hp || 10);
    const plan = {
        head: 0.2,
        torso: 0.4,
        arms: 0.2,
        legs: 0.2
    };

    Object.entries(plan).forEach(([key, pct]) => {
        if (!entity.combatState.limbs[key]) {
            const max = Math.max(1, Math.round(maxHp * pct));
            entity.combatState.limbs[key] = {
                hp: max,
                max,
                bleed: 0,
                disabled: false
            };
        }
    });

    return entity.combatState;
}

function getSetupStat(stat, fallback = 3) {
    const value = G.player && G.player.stats && typeof G.player.stats[stat] === "number"
        ? G.player.stats[stat]
        : fallback;
    return value;
}

function getWeaponDamageDie(player) {
    const weaponName = String(player.weapon || player.equipped?.weapon?.name || "").toLowerCase();
    if (weaponName.includes("dagger")) return 4;
    if (weaponName.includes("staff")) return 5;
    if (weaponName.includes("mace")) return 6;
    if (weaponName.includes("sword")) return 6;
    return 4;
}

function getCombatTargetOptions(npc) {
    hydrateNPCSpeciesFlags(npc);
    if (npc && npc.isHumanoid === false) {
        return ["torso", "head"];
    }
    return ["torso", "head", "arms", "legs"];
}

function createCombatButton(label, onClick, options = {}) {
    const btn = document.createElement("button");
    btn.className = `chat-option-btn combat-option-btn${options.className ? " " + options.className : ""}`;
    btn.textContent = label;
    btn.disabled = options.disabled === true;
    btn.onclick = onClick;
    return btn;
}

function appendCombatGroup(el, title, buttons) {
    const group = document.createElement("div");
    group.className = "combat-action-group";

    const heading = document.createElement("div");
    heading.className = "combat-action-heading";
    heading.textContent = title;
    group.appendChild(heading);

    buttons.forEach(btn => group.appendChild(btn));

}

function renderCombatActionMenu(npc) {
    const el = document.getElementById("chatOptionsEl");
    if (!el || !npc) return;

    G.activeNPCMode = "combat";
    el.innerHTML = "";

    appendCombatGroup(el, "Attack", [
        createCombatButton("Quick strike", () => renderCombatTargetMenu(npc, "quick")),
        createCombatButton("Balanced strike", () => renderCombatTargetMenu(npc, "balanced")),
        createCombatButton("Heavy strike", () => renderCombatTargetMenu(npc, "heavy")),

    ]);

    ]);
