function getChatOptions(npc) {
    if (!canConverseWithNPC(npc)) return [];
    if (typeof queryConversationCatalogue === "function") {
        const options = queryConversationCatalogue(npc, { room: G.activeRoom });
        if (Array.isArray(options) && options.length) return options;
    }
    return [];
}

function clearChatOptions() {
    const el = document.getElementById("chatOptionsEl");
    if (el) el.innerHTML = "";
}

// -- COMBAT ---------------------------------------------------------------

const COMBAT_ATTACK_STYLES = {
    quick: {
        label: "Quick",
        hitBonus: 3,
        damageBonus: -1,
        incomingBonus: -1,
        text: "You press with a fast, controlled strike."
    },
    balanced: {
        label: "Balanced",
        hitBonus: 1,
        damageBonus: 0,
        incomingBonus: 0,
        text: "You commit to a measured attack."
    },
    heavy: {
        label: "Heavy",
        hitBonus: -2,
        damageBonus: 3,
        incomingBonus: 2,
        text: "You put your weight behind a heavy blow."
    },
    precise: {
        label: "Precise",
        hitBonus: -1,
        damageBonus: 0,
        incomingBonus: 0,
        text: "You wait for a cleaner opening."
    }
};

const COMBAT_TARGETS = {
    torso: { label: "Torso", hitMod: 0, damageMod: 1, limbKey: "torso" },
    head:  { label: "Head",  hitMod: 4, damageMod: 1, limbKey: "head" },
    arms:  { label: "Arms",  hitMod: 2, damageMod: 0, limbKey: "arms" },
    legs:  { label: "Legs",  hitMod: 2, damageMod: 0, limbKey: "legs" }
};

function ensureCombatState(entity) {
    if (!entity) return null;
    entity.combatState = entity.combatState || {};
    entity.combatState.limbs = entity.combatState.limbs || {};

    const maxHp = Math.max(1, entity.hpMax || entity.maxHp || entity.hp || 10);
    const plan = {
        head: 0.2,
        torso: 0.4,
        arms: 0.2,
        legs: 0.2
    };

    Object.entries(plan).forEach(([key, pct]) => {
        if (!entity.combatState.limbs[key]) {
            const max = Math.max(1, Math.round(maxHp * pct));
            entity.combatState.limbs[key] = {
                hp: max,
                max,
                bleed: 0,
                disabled: false
            };
        }
    });

    return entity.combatState;
}

function getSetupStat(stat, fallback = 3) {
    const value = G.player && G.player.stats && typeof G.player.stats[stat] === "number"
        ? G.player.stats[stat]
        : fallback;
    return value;
}

function createPlayerStartingItem(name, slot, extras = {}) {
    const normalizedName = String(name || "").trim() || "item";
    return assignLootUID({
        id: `player-${slot}-${normalizedName.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "item"}`,
        name: normalizedName,
        slot,
        type: extras.type || ["gear", slot],
        value: typeof extras.value === "number" ? extras.value : 0,
        modifier: typeof extras.modifier === "number" ? extras.modifier : 0,
        description: extras.description || "",
        ...extras
    });
}

function createLegacyWeaponItem(name) {
    const weaponName = String(name || "").trim() || "Unarmed";
    const baseDamageByWeapon = {
        dagger: 4,
        "short sword": 6,
        sword: 6,
        staff: 5,
        mace: 6,
        spear: 6,
        axe: 8,
        warhammer: 8
    };
    const lookupKey = weaponName.toLowerCase();

    return createPlayerStartingItem(weaponName, "weapon", {
        type: ["weapon", "weapon"],
        weaponType: getWeaponTypeFromName(weaponName, "generic"),
        damage: baseDamageByWeapon[lookupKey] || 4,
        value: 0,
        modifier: 0,
        description: `Your currently readied ${weaponName.toLowerCase()}.`
    });
}

function ensurePlayerEquipmentState(player) {
    if (!player || typeof player !== "object") return player;

    if (!Array.isArray(player.inventory)) player.inventory = [];
    if (!player.equipped || typeof player.equipped !== "object") player.equipped = {};

    const eq = player.equipped;
    const legacyWeaponName = typeof player.weapon === "string" ? player.weapon.trim() : "";

    if (!eq.weapon && legacyWeaponName) {
        eq.weapon = createLegacyWeaponItem(legacyWeaponName);
    }

    player.weapon = eq.weapon ? getItemName(eq.weapon) : "unarmed";

    const defaultClothing = {
        upper: {
            name: "Traveler's tunic",
            type: ["clothes", "upper"],
            description: "A simple tunic that counts as your ordinary day clothes."
        },
        lower: {
            name: "Traveler's trousers",
            type: ["clothes", "lower"],
            description: "Simple trousers worn as your ordinary traveling clothes."
        },
        feet: {
            name: "Travel shoes",
            type: ["clothes", "feet"],
            description: "Practical shoes worn for everyday travel."
        }
    };

    if (!player._baselineClothingSeeded) {
        Object.entries(defaultClothing).forEach(([slot, item]) => {
            if (!eq[slot]) {
                eq[slot] = createPlayerStartingItem(item.name, slot, {
                    type: item.type,
                    value: 0,
                    modifier: 0,
                    description: item.description
                });
            }
        });
        player._baselineClothingSeeded = true;
    }

    return player;
}

const PLAYER_EQUIPMENT_SLOT_META = {
    head: { icon: "🪖", label: "Head" },
    weapon: { icon: "🗡", label: "Weapon" },
    upper: { icon: "🧥", label: "Upper" },
    hands: { icon: "👐", label: "Hands" },
    lower: { icon: "👖", label: "Lower" },
    feet: { icon: "🥾", label: "Feet" },
    belt: { icon: "🎒", label: "Belt" },
    coinPouch: { icon: "💰", label: "Coins" }
};

function getPlayerEquipmentSlots() {
    return ["head", "weapon", "upper", "hands", "lower", "feet", "belt", "coinPouch"];
}

function getEquipmentSlotMeta(slot) {
    return PLAYER_EQUIPMENT_SLOT_META[slot] || { icon: "•", label: slot };
}

function getItemQuantity(item) {
    const quantity = Number(item && item.quantity);
    return Number.isFinite(quantity) && quantity > 0 ? Math.max(1, Math.floor(quantity)) : 1;
}

function getItemUnitValue(item) {
    const value = item && typeof item.value === "number" ? item.value : 1;
    return Math.max(1, value);
}

function getWeaponDamageByName(name = "") {
    const weaponName = String(name || "").toLowerCase();
    if (weaponName.includes("dagger") || weaponName.includes("knife")) return 4;
    if (weaponName.includes("staff")) return 5;
    if (weaponName.includes("mace") || weaponName.includes("club")) return 6;
    if (weaponName.includes("sword")) return 6;
    if (weaponName.includes("spear")) return 6;
    if (weaponName.includes("axe")) return 8;
    if (weaponName.includes("hammer") || weaponName.includes("maul")) return 8;
    return 4;
}

function getItemEquipSlot(item) {
    if (!item || typeof item !== "object") return null;
    if (typeof item.slot === "string" && PLAYER_EQUIPMENT_SLOT_META[item.slot] && item.slot !== "coinPouch") {
        return item.slot;
    }

    const types = Array.isArray(item.type)
        ? item.type.map(entry => String(entry).toLowerCase())
        : [String(item.type || "").toLowerCase()];

    if (types.includes("weapon")) return "weapon";
    if (types.includes("belt")) return "belt";

    const slotMatch = getPlayerEquipmentSlots().find(slot => slot !== "coinPouch" && types.includes(slot));
    if (slotMatch) return slotMatch;

    const name = getItemName(item).toLowerCase();
    if (/(dagger|knife|sword|axe|mace|hammer|maul|staff|spear|trident|glaive|halberd|whip|flail)/.test(name)) return "weapon";
    if (/(belt|girdle|sash)/.test(name)) return "belt";
    if (/(helmet|hood|cap|hat|helm)/.test(name)) return "head";
    if (/(glove|gauntlet|bracer|vambrace)/.test(name)) return "hands";
    if (/(boot|shoe|sandal|slipper)/.test(name)) return "feet";
    if (/(trouser|pants|leggings|greaves|skirt)/.test(name)) return "lower";
    if (/(shirt|tunic|vest|coat|armor|shirt|robe|blouse|jerkin|mail)/.test(name)) return "upper";
    return null;
}

function isItemEquippable(item) {
    return !!getItemEquipSlot(item);
}

function prepareItemForEquip(item, slot) {
    if (!item || typeof item !== "object" || !slot) return item;

    item.slot = slot;
    const types = Array.isArray(item.type) ? item.type.map(entry => String(entry).toLowerCase()) : [];

    if (slot === "weapon") {
        item.type = ["weapon", "weapon"];
        if (!item.weaponType) item.weaponType = getWeaponTypeFromName(getItemName(item), "generic");
        if (typeof item.damage !== "number") item.damage = getWeaponDamageByName(getItemName(item));
        return item;
    }

    const nextTypes = types.slice();
    if (!nextTypes.includes(slot)) nextTypes.push(slot);
    if (!nextTypes.includes("clothes") && !nextTypes.includes("armor") && ["head", "upper", "hands", "lower", "feet"].includes(slot)) {
        nextTypes.unshift("clothes");
    }
    if (slot === "belt" && !nextTypes.includes("belt")) nextTypes.unshift("belt");
    item.type = nextTypes;
    return item;
}

function cloneItemForStackAmount(item, quantity) {
    if (!item || typeof item !== "object") return null;

    const clone = {
        ...item,
        type: Array.isArray(item.type) ? item.type.slice() : item.type
    };

    delete clone._uid;
    delete clone.id;

    const nextQuantity = Math.max(1, Math.floor(quantity || 1));
    if (nextQuantity > 1 || typeof item.quantity === "number") {
        clone.quantity = nextQuantity;
    } else {
        delete clone.quantity;
    }

    return assignLootUID(clone);
}

function getInventoryStackKey(item) {
    if (!item || typeof item !== "object") return "";
    if (item.stackKey) return String(item.stackKey);

    const types = Array.isArray(item.type) ? item.type.map(entry => String(entry).toLowerCase()).sort().join(",") : String(item.type || "").toLowerCase();
    return [
        getItemName(item).toLowerCase(),
        item.slot || "",
        types,
        typeof item.damage === "number" ? item.damage : "",
        typeof item.armor === "number" ? item.armor : "",
        typeof item.modifier === "number" ? item.modifier : "",
        getItemUnitValue(item)
    ].join("|");
}

function buildPlayerInventoryEntries(player) {
    const inventory = Array.isArray(player && player.inventory) ? player.inventory : [];
    const grouped = new Map();

    inventory.forEach(item => {
        if (!item) return;
        const key = getInventoryStackKey(item);
        const entry = grouped.get(key) || {
            key,
            item,
            totalQuantity: 0
        };

        entry.totalQuantity += getItemQuantity(item);
        if (!grouped.has(key)) grouped.set(key, entry);
    });

    return Array.from(grouped.values()).sort((a, b) => {
        return getItemName(a.item).localeCompare(getItemName(b.item));
    });
}

function takeInventoryEntryAmount(player, stackKey, amount) {
    if (!player || !Array.isArray(player.inventory)) return null;

    const targetAmount = Math.max(1, Math.floor(amount || 1));
    let remaining = targetAmount;
    let sample = null;

    for (let i = player.inventory.length - 1; i >= 0 && remaining > 0; i--) {
        const item = player.inventory[i];
        if (!item || getInventoryStackKey(item) !== stackKey) continue;
        if (!sample) sample = item;

        const itemQuantity = getItemQuantity(item);
        if (itemQuantity > remaining) {
            item.quantity = itemQuantity - remaining;
            remaining = 0;
            break;
        }

        player.inventory.splice(i, 1);
        remaining -= itemQuantity;
    }

    const removed = targetAmount - remaining;
    if (!sample || removed <= 0) return null;
    return cloneItemForStackAmount(sample, removed);
}

function getInventoryEntryMaxEquipAmount(entry) {
    return entry && isItemEquippable(entry.item) ? 1 : 0;
}

function formatInventoryItemLabel(item, quantityOverride = null) {
    if (!item) return "item";

    const quantity = quantityOverride == null ? getItemQuantity(item) : Math.max(1, Math.floor(quantityOverride || 1));
    const baseName = getItemName(item);
    if (quantity <= 1) return baseName;
    return `${baseName} x${quantity}`;
}

function createDroppedCoinsItem(amount) {
    const quantity = Math.max(1, Math.floor(amount || 1));
    return assignLootUID({
        name: quantity === 1 ? "Coin" : `${quantity} coins`,
        type: ["coin", "currency"],
        quantity,
        value: 1,
        description: quantity === 1 ? "A single loose coin." : `A small pile of ${quantity} loose coins.`
    });
}

function dropItemIntoCurrentRoom(item) {
    const room = G.activeRoom || getRoom(G.player && G.player.coords);
    if (!room || !item) return false;

    room.items = Array.isArray(room.items) ? room.items : [];
    item.hidden = false;
    item.isHidden = false;
    item.visible = true;
    room.items.push(item);
    return true;
}

function moveEquippedItemToInventory(slot) {
    ensurePlayerEquipmentState(G.player);
    const eq = G.player.equipped || {};
    const item = eq[slot];
    if (!item || slot === "coinPouch") return null;

    delete eq[slot];
    G.player.inventory.push(item);
    if (slot === "weapon") G.player.weapon = "unarmed";
    return item;
}

function dropEquippedItemToRoom(slot) {
    ensurePlayerEquipmentState(G.player);
    const eq = G.player.equipped || {};
    const item = eq[slot];
    if (!item || slot === "coinPouch") return false;

    delete eq[slot];
    if (slot === "weapon") G.player.weapon = "unarmed";
    if (dropItemIntoCurrentRoom(item)) return true;

    eq[slot] = item;
    if (slot === "weapon") G.player.weapon = getItemName(item);
    return false;
}

function equipInventoryEntry(stackKey) {
    ensurePlayerEquipmentState(G.player);

    const entry = buildPlayerInventoryEntries(G.player).find(candidate => candidate.key === stackKey);
    if (!entry) return false;

    const slot = getItemEquipSlot(entry.item);
    if (!slot) return false;

    const item = takeInventoryEntryAmount(G.player, stackKey, 1);
    if (!item) return false;

    prepareItemForEquip(item, slot);

    const existing = G.player.equipped[slot];
    if (existing) G.player.inventory.push(existing);

    G.player.equipped[slot] = item;
    G.player.weapon = slot === "weapon" ? getItemName(item) : (G.player.equipped.weapon ? getItemName(G.player.equipped.weapon) : "unarmed");
    return true;
}

function dropInventoryEntryToRoom(stackKey, amount) {
    ensurePlayerEquipmentState(G.player);

    const item = takeInventoryEntryAmount(G.player, stackKey, amount);
    if (!item) return null;

    const itemTypes = Array.isArray(item.type) ? item.type.map(entry => String(entry).toLowerCase()) : [];
    if (getItemQuantity(item) > 1 && !itemTypes.includes("coin")) {
        item.name = formatInventoryItemLabel(item, getItemQuantity(item));
    }

    if (!dropItemIntoCurrentRoom(item)) {
        G.player.inventory.push(item);
        return null;
    }

    return item;
}

function getEquippedItem(entity, slot) {
    if (!entity || !entity.equipped) return null;
    return entity.equipped[slot] || null;
}

function getItemArmorValue(item) {
    if (!item || Array.isArray(item)) return 0;
    if (typeof item.armor === "number") return Math.max(0, item.armor);
    if (typeof item.modifier === "number") return Math.max(0, item.modifier);
    return 0;
}

function getEntityWeaponItem(entity) {
    return getEquippedItem(entity, "weapon");
}

function getEntityWeaponName(entity) {
    const equippedWeapon = getEntityWeaponItem(entity);
    return String(
        (equippedWeapon && (equippedWeapon.name || equippedWeapon.displayName)) ||
        entity?.weapon ||
        "unarmed"
    );
}

function getWeaponTypeFromName(name = "", fallback = "generic") {
    const key = String(name || "").toLowerCase();
    if (key.includes("dagger")) return "dagger";
    if (key.includes("sword") || key.includes("scimitar") || key.includes("saber") || key.includes("rapier")) return "sword";
    if (key.includes("axe")) return "axe";
    if (key.includes("mace") || key.includes("hammer") || key.includes("maul") || key.includes("morningstar")) return "mace";
    if (key.includes("spear") || key.includes("trident")) return "spear";
    if (key.includes("halberd") || key.includes("glaive") || key.includes("polearm")) return "polearm";
    if (key.includes("staff")) return "staff";
    if (key.includes("flail")) return "flail";
    if (key.includes("whip")) return "whip";
    return fallback;
}

function getEntityWeaponProfile(entity) {
    const weaponItem = getEntityWeaponItem(entity);
    const weaponName = getEntityWeaponName(entity).toLowerCase();
    const weaponType = String(weaponItem?.weaponType || getWeaponTypeFromName(weaponName, "generic")).toLowerCase();

    let damageDie = typeof weaponItem?.damage === "number" ? Math.max(2, weaponItem.damage) : 4;
    if (!(typeof weaponItem?.damage === "number")) {
        if (weaponName.includes("dagger")) damageDie = 4;
        else if (weaponName.includes("staff")) damageDie = 5;
        else if (weaponName.includes("mace")) damageDie = 6;
        else if (weaponName.includes("sword")) damageDie = 6;
        else if (weaponName.includes("axe")) damageDie = 8;
        else if (weaponName.includes("hammer") || weaponName.includes("maul")) damageDie = 8;
        else if (weaponName.includes("spear")) damageDie = 6;
    }

    let hitBonus = 0;
    let damageBonus = 0;
    if (weaponType === "dagger") hitBonus += 1;
    if (weaponType === "sword" || weaponType === "spear" || weaponType === "polearm") hitBonus += 1;
    if (weaponType === "axe" || weaponType === "mace" || weaponType === "flail") damageBonus += 1;

    if (typeof weaponItem?.quality === "number") {
        hitBonus += Math.max(-1, Math.min(1, weaponItem.quality));
    }

    return {
        item: weaponItem,
        name: getEntityWeaponName(entity),
        type: weaponType,
        damageDie,
        hitBonus,
        damageBonus
    };
}

function getWeaponDamageDie(entity) {
    const weaponName = getEntityWeaponName(entity).toLowerCase();
    if (weaponName.includes("dagger")) return 4;
    if (weaponName.includes("staff")) return 5;
    if (weaponName.includes("mace")) return 6;
    if (weaponName.includes("sword")) return 6;
    return getEntityWeaponProfile(entity).damageDie;
}

function getEquippedArmorTotal(entity) {
    if (!entity || !entity.equipped) return 0;
    return ["head", "upper", "hands", "lower", "feet"].reduce((sum, slot) => {
        return sum + getItemArmorValue(entity.equipped[slot]);
    }, 0);
}

function getTargetArmorClassBonus(entity, targetKey = "torso") {
    const eq = entity?.equipped || {};
    const headArmor = getItemArmorValue(eq.head);
    const upperArmor = getItemArmorValue(eq.upper);
    const handsArmor = getItemArmorValue(eq.hands);
    const lowerArmor = getItemArmorValue(eq.lower);
    const feetArmor = getItemArmorValue(eq.feet);

    if (targetKey === "head") return Math.min(2, headArmor);
    if (targetKey === "torso") return Math.min(3, Math.ceil(upperArmor / 2));
    if (targetKey === "arms") return Math.min(2, Math.floor((upperArmor + handsArmor) / 3));
    if (targetKey === "legs") return Math.min(2, Math.floor((lowerArmor + feetArmor) / 3));
    return 0;
}

function getEquipmentDodgeBonus(entity) {
    const eq = entity?.equipped || {};
    return ["upper", "lower", "feet", "head"].reduce((sum, slot) => {
        const item = eq[slot];
        if (!item || Array.isArray(item)) return sum;
        let next = sum;
        if (typeof item.dodgeBonus === "number") next += item.dodgeBonus;
        if (item.enchantment === "elusion") next += 2;
        return next;
    }, 0);
}

function getEntityArmorClass(entity, targetKey = "torso") {
    if (!entity) return 10;

    const totalArmor = getEquippedArmorTotal(entity);
    let armorClass = typeof entity.armor === "number" ? entity.armor : 10;

    if (totalArmor > 0) {
        armorClass = 10 + Math.min(6, Math.floor(totalArmor / 2));
    }

    if (entity.size === "small") armorClass += 1;
    if (entity.size === "large") armorClass -= 1;

    armorClass += getTargetArmorClassBonus(entity, targetKey);
    armorClass += getEquipmentDodgeBonus(entity);

    return Math.max(5, armorClass);
}

function getTargetDamageReduction(entity, targetKey = "torso", damageTypes = "physical") {
    const eq = entity?.equipped || {};
    const types = Array.isArray(damageTypes) ? damageTypes : [damageTypes];
    const slotsByTarget = {
        head: ["head"],
        torso: ["upper"],
        arms: ["upper", "hands"],
        legs: ["lower", "feet"]
    };
    const slots = slotsByTarget[targetKey] || ["upper"];

    let reduction = 0;
    slots.forEach(slot => {
        const item = eq[slot];
        if (!item || Array.isArray(item)) return;

        if (types.includes("physical")) {
            reduction += getItemArmorValue(item);
        }

        if (item.resistances) {
            types.forEach(type => {
                reduction += item.resistances[type] || 0;
            });
        }

        if (item.enchantment === "fireproof" && types.includes("fire")) reduction += 3;
        if (item.enchantment === "frostguard" && types.includes("ice")) reduction += 3;
    });

    const scaled = targetKey === "head"
        ? Math.ceil(reduction / 2)
        : targetKey === "torso"
            ? Math.ceil(reduction / 3)
            : Math.floor(reduction / 4);

    return Math.max(0, Math.min(5, scaled));
}

function getCombatTargetOptions(npc) {
    hydrateNPCSpeciesFlags(npc);
    if (npc && npc.isHumanoid === false) {
        return ["torso", "head"];
    }
    return ["torso", "head", "arms", "legs"];
}

function createCombatButton(label, onClick, options = {}) {
    const btn = document.createElement("button");
    btn.className = `chat-option-btn combat-option-btn${options.className ? " " + options.className : ""}`;
    btn.textContent = label;
    btn.disabled = options.disabled === true;
    btn.onclick = onClick;
    return btn;
}

function appendCombatGroup(el, title, buttons) {
    const group = document.createElement("div");
    group.className = "combat-action-group";

    const heading = document.createElement("div");
    heading.className = "combat-action-heading";
    heading.textContent = title;
    group.appendChild(heading);

    buttons.forEach(btn => group.appendChild(btn));
    el.appendChild(group);
}

function renderCombatActionMenu(npc) {
    const el = document.getElementById("chatOptionsEl");
    if (!el || !npc) return;

    G.activeNPCMode = "combat";
    el.innerHTML = "";

    appendCombatGroup(el, "Attack", [
        createCombatButton("Quick strike", () => renderCombatTargetMenu(npc, "quick")),
        createCombatButton("Balanced strike", () => renderCombatTargetMenu(npc, "balanced")),
        createCombatButton("Heavy strike", () => renderCombatTargetMenu(npc, "heavy")),
        createCombatButton("Precise strike", () => renderCombatTargetMenu(npc, "precise"))
    ]);

    appendCombatGroup(el, "Defense", [
        createCombatButton("Defend", () => performCombatDefense(npc, "defend")),
        createCombatButton("Guard", () => performCombatDefense(npc, "guard")),
        createCombatButton("Counter", () => performCombatDefense(npc, "counter")),
        createCombatButton("Escape", () => attemptCombatEscape(npc))
    ]);

    appendCombatGroup(el, "Other", [
        createCombatButton("Step back", () => renderNPCActionMenu(npc))
    ]);
}

function renderCombatTargetMenu(npc, styleKey) {
    const el = document.getElementById("chatOptionsEl");
    if (!el || !npc) return;

    const style = COMBAT_ATTACK_STYLES[styleKey] || COMBAT_ATTACK_STYLES.balanced;
    el.innerHTML = "";

    const buttons = getCombatTargetOptions(npc).map(targetKey => {
        const target = COMBAT_TARGETS[targetKey];
        return createCombatButton(
            `${style.label}: ${target.label}`,
            () => attackNPC(npc, { style: styleKey, target: targetKey })
        );
    });

    buttons.push(createCombatButton("Back", () => renderCombatActionMenu(npc)));
    appendCombatGroup(el, "Target", buttons);
}

function describeCombatWounds(entity) {
    const state = ensureCombatState(entity);
    if (!state) return "";

    const parts = [];
    Object.entries(state.limbs).forEach(([key, limb]) => {
        const ratio = limb.max > 0 ? limb.hp / limb.max : 1;
        if (limb.disabled || ratio <= 0) parts.push(`${key} disabled`);
        else if (ratio <= 0.35) parts.push(`${key} badly hurt`);
        else if (ratio <= 0.65) parts.push(`${key} hurt`);
    });

    return parts.length ? parts.join(", ") : "";
}

function syncCombatWoundMemory(entity) {
    if (!entity) return;
    const state = ensureCombatState(entity);
    entity.memory = entity.memory || {};
    entity.memory.limbDamage = entity.memory.limbDamage || {};

    Object.entries(state.limbs).forEach(([key, limb]) => {
        const ratio = limb.max > 0 ? limb.hp / limb.max : 1;
        let severity = 0;
        if (limb.disabled || ratio <= 0) severity = 3;
        else if (ratio <= 0.35) severity = 2;
        else if (ratio <= 0.65) severity = 1;

        if (severity > 0) entity.memory.limbDamage[key] = severity;
        else delete entity.memory.limbDamage[key];
    });
}

function applyCombatBleeding(entity, lines, name) {
    const state = ensureCombatState(entity);
    if (!state || !entity || entity.hp <= 0) return;

    const totalBleed = Object.values(state.limbs).reduce((sum, limb) => sum + (limb.bleed || 0), 0);
    if (totalBleed <= 0) return;

    entity.hp = Math.max(0, entity.hp - totalBleed);
    lines.push(`${name} loses ${totalBleed} HP from bleeding.`);

    Object.values(state.limbs).forEach(limb => {
        limb.bleed = Math.max(0, limb.bleed - 1);
    });
}

function applyCombatDamage(entity, amount, targetKey, options = {}) {
    const state = ensureCombatState(entity);
    const limbKey = COMBAT_TARGETS[targetKey]?.limbKey || "torso";
    const limb = state.limbs[limbKey] || state.limbs.torso;
    const damage = Math.max(1, amount);

    entity.hp = Math.max(0, (typeof entity.hp === "number" ? entity.hp : entity.hpMax || 1) - damage);

    if (limb) {
        const limbDamage = Math.max(1, Math.floor(damage * (targetKey === "torso" ? 0.5 : 0.85)));
        limb.hp = Math.max(0, limb.hp - limbDamage);
        if (limb.hp <= 0) limb.disabled = true;

        if (options.bleed || targetKey === "torso" && options.crit) {
            limb.bleed = Math.max(limb.bleed || 0, options.crit ? 2 : 1);
        }
    }

    syncCombatWoundMemory(entity);
}

function getWoundAttackPenalty(entity) {
    const state = ensureCombatState(entity);
    const arms = state?.limbs?.arms;
    const head = state?.limbs?.head;
    let penalty = 0;
    if (arms) {
        const ratio = arms.max > 0 ? arms.hp / arms.max : 1;
        if (arms.disabled || ratio <= 0) penalty += 4;
        else if (ratio <= 0.35) penalty += 2;
        else if (ratio <= 0.65) penalty += 1;
    }
    if (head) {
        const ratio = head.max > 0 ? head.hp / head.max : 1;
        if (head.disabled || ratio <= 0) penalty += 3;
        else if (ratio <= 0.35) penalty += 2;
    }
    return penalty;
}

function getWoundDefensePenalty(entity) {
    const state = ensureCombatState(entity);
    const legs = state?.limbs?.legs;
    if (!legs) return 0;

    const ratio = legs.max > 0 ? legs.hp / legs.max : 1;
    if (legs.disabled || ratio <= 0) return 4;
    if (ratio <= 0.35) return 2;
    if (ratio <= 0.65) return 1;
    return 0;
}

function getPlayerStanceArmorBonus() {
    const stance = G.player?.combatState?.stance;
    if (stance === "defend") return 3;
    if (stance === "guard") return 2;
    if (stance === "counter") return 1;
    return 0;
}

function getPlayerStanceDamageMultiplier() {
    const stance = G.player?.combatState?.stance;
    if (stance === "defend") return 0.55;
    if (stance === "guard") return 0.75;
    return 1;
}

function clearPlayerCombatStance() {
    if (G.player?.combatState) G.player.combatState.stance = null;
}

function performCombatDefense(npc, stance) {
    if (!npc || npc.unconscious || npc.isUnconsciousBody || npc.hidden || npc.isHidden) return;

    ensureCombatState(G.player).stance = stance;
    const npcName = npc.name || "the creature";
    const stanceText = {
        defend: "You settle into a defensive stance.",
        guard: "You raise your guard and prepare to absorb the next attack.",
        counter: "You invite an opening, ready to counter if they miss."
    }[stance] || "You brace yourself.";

    const lines = [stanceText];
    resolveNPCCounter(npc, lines, { playerPassed: true });

    if (npc.hp <= 0 || npc.unconscious || npc.isHidden || G.activeNPC !== npc) {
        return;
    }

    renderStats();
    renderCombatActionMenu(npc);
    setNarration(lines.join(" "));
    rememberStoryEvent("combat", `${G.player.name} defended against ${npcName}.`, 3);
    saveGameState();
}

function attemptCombatEscape(npc) {
    if (!npc) return;

    const player = G.player;
    const npcName = npc.name || "the creature";
    const legPenalty = getWoundDefensePenalty(npc);
    const playerRoll = randInt(1, 20) + getSetupStat("flexibility", 3);
    const npcRoll = randInt(1, 20) + Math.max(0, Math.floor((npc.hostility || 0) / 35)) - legPenalty;
    const lines = [];

    if (playerRoll >= npcRoll) {
        lines.push(`You break away from ${npcName}.`);
        G.activeNPCMode = "menu";
        renderNPCActionMenu(npc);
        setNarration(lines.join(" "));
        rememberStoryEvent("combat", `${G.player.name} escaped combat with ${npcName}.`, 5);
        saveGameState();
        return;
    }

    lines.push(`${npcName} cuts off your escape.`);
    resolveNPCCounter(npc, lines, { playerPassed: true, escapeFailed: true });

    if (npc.hp <= 0 || npc.unconscious || npc.isHidden || G.activeNPC !== npc) {
        return;
    }

    renderStats();
    renderCombatActionMenu(npc);
    setNarration(lines.join(" "));
    saveGameState();
}

function renderNPCActionMenu(npc) {
    const el = document.getElementById("chatOptionsEl");
    if (!el) return;

    el.innerHTML = "";
    if (!npc) return;
    if (typeof ensureNPCRelationshipState === "function") ensureNPCRelationshipState(npc);

    const actions = [];
    if (canConverseWithNPC(npc)) {
        actions.push({ label: "Talk", action: "talk" });
    }
    const hostility = typeof npc.hostility === "number" ? npc.hostility : 0;
    const favor = npc.memory && typeof npc.memory.favorability === "number" ? npc.memory.favorability : 0;

    if (hostility < 80 && favor > -70) {
        actions.push({ label: "Trade", action: "trade" });
    }

    actions.push(
        { label: "Attack", action: "attack", className: "danger" },
        { label: "Step away", action: "disengage" }
    );

    actions.forEach(option => {
        const btn = document.createElement("button");
        btn.className = `chat-option-btn npc-action-btn${option.className ? " " + option.className : ""}`;
        btn.textContent = option.label;
        btn.onclick = () => chooseNPCAction(option.action);
        el.appendChild(btn);
    });
}

function chooseNPCAction(action) {
    const npc = G.activeNPC;
    if (!npc) return;

    if (action === "talk") {
        startNPCConversation(npc);
        return;
    }

    if (action === "trade") {
        tradeWithNPC(npc);
        return;
    }

    if (action === "attack") {
        renderCombatActionMenu(npc);
        return;
    }

    if (action === "disengage") {
        disengageFromNPC();
    }
}

function startNPCConversation(npc) {
    if (!canConverseWithNPC(npc)) {
        setNarration(`${npc.name} does not seem capable of conversation.`);
        renderNPCActionMenu(npc);
        saveGameState();
        return;
    }

    G.activeNPCMode = "talk";
    renderChatOptions(npc, getChatOptions(npc));
    setNarration(`You prepare to speak with ${npc.name}.`);
    saveGameState();
}

function tradeWithNPC(npc) {
    if (!canConverseWithNPC(npc)) {
        G.activeNPCMode = "menu";
        setNarration(`${npc.name} does not seem capable of trade.`);
        renderNPCActionMenu(npc);
        saveGameState();
        return;
    }

    if (typeof ensureNPCRelationshipState === "function") ensureNPCRelationshipState(npc);
    if ((npc.hostility || 0) >= 80 || (npc.memory && (npc.memory.favorability || 0) <= -70)) {
        applyNPCImpact(npc, {
            mood: -1,
            favor: -2,
            hostility: 2,
            aggression: 1,
            intent: "trade",
            actionTag: "refused-trade"
        });
        G.activeNPCMode = "menu";
        renderNPCActionMenu(npc);
        setNarration(`${npc.name} refuses to trade while things stand like this.`);
        saveGameState();
        return;
    }

    G.activeNPCMode = "trade";
    renderTradeOptions(npc);
    setNarration(`You look over what ${npc.name} has to trade.`);
    saveGameState();
}

function attackNPC(npc, options = {}) {
    if (!npc || npc.unconscious || npc.isUnconsciousBody || npc.hidden || npc.isHidden) return;

    G.activeNPCMode = "combat";
    const player = G.player;
    const npcName = npc.name || "the creature";
    const styleKey = options.style || "balanced";
    const targetKey = options.target || "torso";
    const style = COMBAT_ATTACK_STYLES[styleKey] || COMBAT_ATTACK_STYLES.balanced;
    const target = COMBAT_TARGETS[targetKey] || COMBAT_TARGETS.torso;
    const playerWeapon = getEntityWeaponProfile(player);
    const npcArmor = getEntityArmorClass(npc, targetKey) +
        target.hitMod +
        -Math.max(0, getWoundDefensePenalty(npc));
    const attackRoll = randInt(1, 20);
    const statBonus = Math.max(0, Math.floor((getSetupStat("physicalProwess", 3) - 3) / 2));
    const attackTotal = attackRoll +
        (player.attackBonus || 0) +
        statBonus +
        playerWeapon.hitBonus +
        style.hitBonus -
        getWoundAttackPenalty(player);
    const hit = attackRoll === 20 || (attackRoll !== 1 && attackTotal >= npcArmor);
    const crit = attackRoll === 20 || (hit && attackTotal - npcArmor >= 8);
    const lines = [];

    ensureCombatState(player);
    ensureCombatState(npc);
    applyCombatBleeding(player, lines, player.name || "You");
    applyCombatBleeding(npc, lines, npcName);

    if (player.hp <= 0) {
        lines.push("You collapse.");
        renderStats();
        setNarration(lines.join(" "));
        saveGameState();
        return;
    }

    if (npc.hp <= 0) {
        finishNPCDefeat(npc, npcName, lines, { cause: "bleeding", lethal: true });
        return;
    }

    lines.push(`${style.text} You aim for ${npcName}'s ${target.label.toLowerCase()}.`);

    if (hit) {
        const weaponDie = playerWeapon.damageDie;
        const damageRoll = randInt(1, weaponDie);
        const preciseBonus = styleKey === "precise" && targetKey !== "torso" ? 2 : 0;
        const rawDamage = Math.max(1,
            damageRoll +
            Math.max(0, player.attackBonus || 0) +
            statBonus +
            playerWeapon.damageBonus +
            style.damageBonus +
            target.damageMod +
            preciseBonus +
            (crit ? Math.ceil(weaponDie / 2) : 0)
        );
        const blocked = getTargetDamageReduction(npc, targetKey, "physical");
        const damage = Math.max(1, rawDamage - blocked);
        applyCombatDamage(npc, damage, targetKey, {
            crit,
            bleed: crit || styleKey === "heavy" || targetKey === "torso"
        });
        applyNPCImpact(npc, {
            mood: crit || damage >= Math.max(3, Math.ceil((npc.hpMax || 10) * 0.2)) ? -2 : -1,
            favor: crit ? -16 : -10,
            hostility: 25,
            aggression: 1,
            attraction: -6,
            arousal: 4,
            intent: "attack",
            moodOverride: crit ? "furious" : null,
            markMet: true,
            actionTag: "attacked-by-player"
        });
        lines.push(`You hit for ${damage} damage${crit ? " with a telling blow" : ""}${blocked > 0 ? ` after ${blocked} was absorbed by gear` : ""}.`);

        const woundText = describeCombatWounds(npc);
        if (woundText) lines.push(`${npcName} is showing wounds: ${woundText}.`);
    } else {
        applyNPCImpact(npc, {
            mood: -1,
            favor: -4,
            hostility: 10,
            aggression: 1,
            attraction: -2,
            arousal: 2,
            intent: "attack",
            markMet: true,
            actionTag: "attacked-by-player"
        });
        lines.push(`You miss.`);
    }

    if (npc.hp <= 0) {
        finishNPCDefeat(npc, npcName, lines, {
            cause: "attack",
            style: styleKey,
            target: targetKey,
            crit
        });
        return;
    }

    if (typeof generateNPCBehavior === "function") {
        npc.behavior = generateNPCBehavior(npc);
    }

    if (maybeRenderNPCSurrender(npc, lines)) {
        renderStats();
        setNarration(lines.join(" "));
        saveGameState();
        return;
    }

    resolveNPCCounter(npc, lines, {
        playerMissed: !hit,
        playerStyle: styleKey,
        openingBonus: !hit && style.incomingBonus > 0 ? style.incomingBonus : 0
    });

    if (npc.hp <= 0 || npc.unconscious || npc.isHidden || G.activeNPC !== npc) {
        return;
    }

    if (player.hp <= 0) {
        lines.push("You collapse.");
        rememberStoryEvent("combat", `${G.player.name} was brought down by ${npcName}.`, 12);
    } else {
        rememberStoryEvent("combat", `${G.player.name} attacked ${npcName}.`, 4);
    }

    renderStats();
    renderCombatActionMenu(npc);
    setNarration(lines.join(" "));
    clearPlayerCombatStance();
    saveGameState();
}

function resolveNPCCounter(npc, lines, context = {}) {
    if (!npc || npc.hp <= 0) return;

    const player = G.player;
    const npcName = npc.name || "the creature";
    const npcPlan = chooseNPCCombatPlan(npc, context);
    const npcWeapon = getEntityWeaponProfile(npc);

    if (npcPlan.type === "recover") {
        lines.push(`${npcName} hangs back and tries to recover their guard.`);
        npc.combatState = npc.combatState || {};
        npc.combatState.stance = "guard";
        clearPlayerCombatStance();
        return;
    }

    const counterRoll = randInt(1, 20);
    const counterBonus = Math.max(0, Math.floor((npc.hostility || 0) / 35)) +
        npcPlan.hitBonus -
        getWoundAttackPenalty(npc) +
        npcWeapon.hitBonus +
        (context.openingBonus || 0);
    const counterTotal = counterRoll + counterBonus;
    const playerArmor = getEntityArmorClass(player, npcPlan.target) +
        getPlayerStanceArmorBonus() -
        getWoundDefensePenalty(player);
    const counterHits = counterRoll === 20 || (counterRoll !== 1 && counterTotal >= playerArmor);

    lines.push(npcPlan.line);

    if (counterHits) {
        const rawDamage = Math.max(1, randInt(1, npcPlan.damageDie) + npcPlan.damageBonus + npcWeapon.damageBonus);
        const blocked = getTargetDamageReduction(player, npcPlan.target, "physical");
        let counterDamage = Math.max(1, rawDamage - blocked);
        counterDamage = Math.max(1, Math.floor(counterDamage * getPlayerStanceDamageMultiplier()));
        applyCombatDamage(player, counterDamage, npcPlan.target, {
            crit: counterRoll === 20,
            bleed: counterRoll === 20
        });
        lines.push(`${npcName} hits you for ${counterDamage} damage${blocked > 0 ? ` after your gear absorbs ${blocked}` : ""}.`);
    } else {
        lines.push(`${npcName} misses.`);
        if (player.combatState?.stance === "counter") {
            const riposteDamage = Math.max(1, randInt(1, 3) + Math.floor((player.attackBonus || 0) / 2));
            applyCombatDamage(npc, riposteDamage, "torso", { bleed: false });
            lines.push(`You counter for ${riposteDamage} damage.`);
            if (npc.hp <= 0) {
                finishNPCDefeat(npc, npcName, lines, {
                    cause: "counter",
                    style: "counter",
                    target: "torso",
                    crit: false
                });
                return;
            }
        }
    }

    clearPlayerCombatStance();
}

function chooseNPCCombatPlan(npc, context = {}) {
    const hpMax = Math.max(1, npc.hpMax || npc.hp || 10);
    const hpRatio = Math.max(0, npc.hp || 0) / hpMax;
    const temperament = String(npc.temperament || npc.personalityProfile?.temperament || "").toLowerCase();
    const aggressive = ["hostile", "aggressive", "bold"].includes(temperament) || (npc.hostility || 0) >= 70;
    const cautious = ["skittish", "wary", "calm"].includes(temperament);
    const weapon = getEntityWeaponProfile(npc);
    const weaponText = weapon.name && weapon.name !== "unarmed" ? ` with ${weapon.name}` : "";

    if (hpRatio < 0.35 && cautious && Math.random() < 0.35) {
        return { type: "recover" };
    }

    const canHeavy = aggressive && hpRatio > 0.45 && Math.random() < 0.45;
    const wounded = hpRatio < 0.5;
    const target = wounded && Math.random() < 0.35 ? "legs" : "torso";

    if (canHeavy) {
        return {
            type: "attack",
            target,
            hitBonus: -1,
            damageBonus: 3,
            damageDie: weapon.damageDie,
            line: `${npc.name || "The creature"} makes a heavy attack${weaponText}.`
        };
    }

    if (wounded || context.escapeFailed) {
        return {
            type: "attack",
            target,
            hitBonus: 2,
            damageBonus: 0,
            damageDie: weapon.damageDie,
            line: `${npc.name || "The creature"} snaps back with a quick attack${weaponText}.`
        };
    }

    return {
        type: "attack",
        target,
        hitBonus: 0,
        damageBonus: 1,
        damageDie: weapon.damageDie,
        line: `${npc.name || "The creature"} attacks${weaponText}.`
    };
}

function maybeRenderNPCSurrender(npc, lines) {
    if (!npc || npc.surrendered || npc.refusesSurrender) return false;
    hydrateNPCSpeciesFlags(npc);
    if (typeof ensureNPCRelationshipState === "function") ensureNPCRelationshipState(npc);
    if (npc.isHumanoid === false) return false;

    const hpMax = Math.max(1, npc.hpMax || npc.hp || 10);
    const hpRatio = (npc.hp || 0) / hpMax;
    const temperament = String(npc.temperament || npc.personalityProfile?.temperament || "").toLowerCase();
    if (["aggressive", "hostile"].includes(temperament) && hpRatio > 0.12) return false;
    if (hpRatio > 0.25) return false;

    const chance = hpRatio <= 0.1 ? 0.85 : 0.45;
    if (Math.random() > chance) return false;

    npc.surrendered = true;
    applyNPCImpact(npc, {
        mood: -1,
        favor: -2,
        hostility: -25,
        intent: "surrender",
        moodOverride: "afraid",
        actionTag: "surrender-attempt"
    });
    lines.push(`${npc.name || "The creature"} falters and tries to surrender.`);
    renderNPCSurrenderOptions(npc);
    return true;
}

function renderNPCSurrenderOptions(npc) {
    const el = document.getElementById("chatOptionsEl");
    if (!el) return;
    el.innerHTML = "";

    appendCombatGroup(el, "Surrender", [
        createCombatButton("Accept surrender", () => acceptNPCSurrender(npc)),
        createCombatButton("Keep fighting", () => refuseNPCSurrender(npc), { className: "danger" }),
        createCombatButton("Step away", () => disengageFromNPC())
    ]);
}

function acceptNPCSurrender(npc) {
    if (!npc) return;
    npc.surrendered = true;
    applyNPCImpact(npc, {
        mood: 1,
        favor: 10,
        hostility: -35,
        attraction: 4,
        arousal: 2,
        intent: "mercy",
        moodOverride: "subdued",
        actionTag: "mercy-shown"
    });

    G.activeNPCMode = "menu";
    if (typeof generateNPCBehavior === "function") npc.behavior = generateNPCBehavior(npc);
    renderNPCActionMenu(npc);
    setNarration(`${npc.name || "The creature"} lowers their guard and yields.`);
    rememberStoryEvent("combat", `${G.player.name} accepted ${npc.name || "an opponent"}'s surrender.`, 6);
    saveGameState();
}

function refuseNPCSurrender(npc) {
    if (!npc) return;
    npc.surrendered = false;
    npc.refusesSurrender = true;
    applyNPCImpact(npc, {
        mood: -2,
        favor: -10,
        hostility: 100 - (npc.hostility || 0),
        aggression: 1,
        attraction: -8,
        arousal: 3,
        intent: "cruelty",
        moodOverride: "desperate",
        actionTag: "mercy-refused"
    });
    renderCombatActionMenu(npc);
    setNarration(`${npc.name || "The creature"} realizes mercy is not coming.`);
    saveGameState();
}

function determineCombatDefeatOutcome(context = {}) {
    if (context.lethal === true || context.cause === "bleeding") return "corpse";
    if (context.crit && context.target === "head") return "corpse";
    if (context.style === "heavy" && ["head", "torso"].includes(context.target)) return "corpse";
    if (context.target === "head" && Math.random() < 0.35) return "corpse";
    return "unconscious";
}

function moveDefeatedNPCToRoomObject(npc, outcome, context = {}) {
    const room = G.activeRoom || getRoom(G.player && G.player.coords);
    if (!room || !npc) return npc;

    room.items = Array.isArray(room.items) ? room.items : [];
    room.creatures = Array.isArray(room.creatures) ? room.creatures : [];

    const creatureIndex = room.creatures.findIndex(creature =>
        creature === npc || (creature && npc.id && creature.id === npc.id)
    );
    if (creatureIndex >= 0) room.creatures.splice(creatureIndex, 1);

    const originalName = npc.originalName || npc.name || npc.species || "opponent";
    npc.originalName = originalName;
    npc.bodyState = outcome;
    npc.objectType = "body";
    npc.tags = Array.isArray(npc.tags) ? npc.tags : [];
    if (!npc.tags.includes("body")) npc.tags.push("body");
    if (!npc.tags.includes(outcome)) npc.tags.push(outcome);
    npc.visible = true;
    npc.hidden = false;
    npc.isHidden = false;
    npc.isUnconsciousBody = outcome === "unconscious";
    npc.unconscious = outcome === "unconscious";
    npc.dead = outcome === "corpse";
    npc.hp = outcome === "corpse" ? 0 : Math.max(1, npc.hp || 0);
    npc.defeatContext = context;
    npc.description = outcome === "corpse"
        ? `The body of ${originalName} lies still.`
        : `${originalName} lies unconscious and vulnerable.`;
    npc.name = outcome === "corpse"
        ? `corpse of ${originalName}`
        : `unconscious ${originalName}`;

    if (!room.items.some(item => item === npc || (item && npc.id && item.id === npc.id))) {
        room.items.push(npc);
    }

    return npc;
}

function finishNPCDefeat(npc, npcName, lines, context = {}) {
    const outcome = determineCombatDefeatOutcome(context);
    const body = moveDefeatedNPCToRoomObject(npc, outcome, context);
    lines.push(outcome === "corpse"
        ? `${npcName} falls dead.`
        : `${npcName} collapses unconscious.`);
    rememberStoryEvent("combat", `${G.player.name} defeated ${npcName}.`, 8);
    addStoryBeat("local-danger", `${npcName} was defeated and left as ${outcome === "corpse" ? "a corpse" : "an unconscious body"}.`, 5);
    G.activeNPC = null;
    G.activeObject = body;
    G.activeNPCMode = null;
    renderRoom();
    selectRoomObject(body, lines.join(" "));
}

function getItemName(item) {
    return String(item && (item.name || item.displayName || item.id) ? (item.name || item.displayName || item.id) : "item");
}

function getItemValue(item) {
    return getItemUnitValue(item) * getItemQuantity(item);
}

function ensureNPCTradeStock(npc) {
    if (!npc) return [];
    if (!Array.isArray(npc.inventory)) npc.inventory = [];
    return npc.inventory.filter(item => item && !item.hidden && !item.isHidden && getItemValue(item) > 0);
}

function renderTradeOptions(npc) {
    const el = document.getElementById("chatOptionsEl");
    if (!el) return;

    el.innerHTML = "";
    if (!canConverseWithNPC(npc)) {
        renderNPCActionMenu(npc);
        return;
    }

    const stock = ensureNPCTradeStock(npc);
    const playerInventory = Array.isArray(G.player.inventory) ? G.player.inventory : [];

    stock.forEach(item => {
        const price = getItemValue(item);
        const btn = document.createElement("button");
        btn.className = "chat-option-btn trade-option-btn";
        btn.textContent = `Buy ${getItemName(item)} (${price}g)`;
        btn.disabled = !hasEnoughCoins(G.player, price);
        btn.onclick = () => buyTradeItem(npc, item);
        el.appendChild(btn);
    });

    playerInventory.forEach(item => {
        const price = Math.max(1, Math.floor(getItemValue(item) / 2));
        const btn = document.createElement("button");
        btn.className = "chat-option-btn trade-option-btn";
        btn.textContent = `Sell ${getItemName(item)} (${price}g)`;
        btn.disabled = !hasEnoughCoins(npc, price);
        btn.onclick = () => sellTradeItem(npc, item);
        el.appendChild(btn);
    });

    if (!stock.length && !playerInventory.length) {
        const btn = document.createElement("button");
        btn.className = "chat-option-btn";
        btn.textContent = "No goods available";
        btn.disabled = true;
        el.appendChild(btn);
    }

    const backBtn = document.createElement("button");
    backBtn.className = "chat-option-btn npc-action-btn";
    backBtn.textContent = "Back";
    backBtn.onclick = () => {
        G.activeNPCMode = "menu";
        renderNPCActionMenu(npc);
    };
    el.appendChild(backBtn);
}

function recordTradeMemory(npc, playerGave, npcGave, playerCoins, npcCoins) {
    if (!npc) return;
    if (!npc.memory) npc.memory = {};
    if (!Array.isArray(npc.memory.trades)) npc.memory.trades = [];

    const playerItems = Array.isArray(playerGave) ? playerGave : [];
    const npcItems = Array.isArray(npcGave) ? npcGave : [];
    const playerTotal = playerItems.reduce((sum, item) => sum + getItemValue(item), 0) + (playerCoins || 0);
    const npcTotal = npcItems.reduce((sum, item) => sum + getItemValue(item), 0) + (npcCoins || 0);

    npc.memory.tradeCount = (npc.memory.tradeCount || 0) + 1;
    npc.memory.trades.push({
        time: Date.now(),
        player: G.player && G.player.name ? G.player.name : "Adventurer",
        playerGave: playerItems.map(getItemName),
        npcGave: npcItems.map(getItemName),
        playerCoins: playerCoins || 0,
        npcCoins: npcCoins || 0,
        netBenefit: playerTotal - npcTotal
    });

    if (npc.memory.trades.length > 10) npc.memory.trades.shift();

    const netBenefit = playerTotal - npcTotal;
    if (netBenefit >= 6) {
        applyNPCImpact(npc, { mood: 1, favor: 5, hostility: -2, intent: "gift", actionTag: "generous-trade" });
    } else if (netBenefit > 0) {
        applyNPCImpact(npc, { mood: 0, favor: 2, hostility: -1, intent: "trade", actionTag: "fair-trade" });
    } else if (netBenefit <= -6) {
        applyNPCImpact(npc, { mood: -1, favor: -3, hostility: 2, intent: "trade", actionTag: "hard-bargain" });
    }
}

function buyTradeItem(npc, item) {
    if (!npc || !item) return;

    const price = getItemValue(item);
    if (!hasEnoughCoins(G.player, price)) {
        showTradeMessage(`You do not have enough coin for ${getItemName(item)}.`, false);
        renderTradeOptions(npc);
        return;
    }

    if (!isTradeAccepted(price, getItemValue(item), npc)) {
        showTradeMessage(`${npc.name} refuses the offer.`, false);
        renderTradeOptions(npc);
        saveGameState();
        return;
    }

    if (!Array.isArray(G.player.inventory)) G.player.inventory = [];
    if (!Array.isArray(npc.inventory)) npc.inventory = [];

    const index = npc.inventory.indexOf(item);
    if (index < 0) return;

    const purchasedItem = npc.inventory.splice(index, 1)[0];
    G.player.inventory.push(purchasedItem);
    adjustCoins(G.player, -price);
    adjustCoins(npc, price);
    recordTradeMemory(npc, [], [purchasedItem], price, 0);

    addChatMessage("left", "Narrator", `You buy ${getItemName(item)} for ${price}g.`, { mode: "narration" });
    renderStats();
    renderTradeOptions(npc);
    saveGameState();
}

function sellTradeItem(npc, item) {
    if (!npc || !item || !Array.isArray(G.player.inventory)) return;

    const price = Math.max(1, Math.floor(getItemValue(item) / 2));
    if (!hasEnoughCoins(npc, price)) {
        showTradeMessage(`${npc.name} cannot afford ${getItemName(item)}.`, false);
        renderTradeOptions(npc);
        return;
    }

    if (!isTradeAccepted(getItemValue(item), price, npc)) {
        showTradeMessage(`${npc.name} refuses the offer.`, false);
        renderTradeOptions(npc);
        saveGameState();
        return;
    }

    if (!Array.isArray(npc.inventory)) npc.inventory = [];

    const index = G.player.inventory.indexOf(item);
    if (index < 0) return;

    const soldItem = G.player.inventory.splice(index, 1)[0];
    npc.inventory.push(soldItem);
    adjustCoins(G.player, price);
    adjustCoins(npc, -price);
    recordTradeMemory(npc, [soldItem], [], 0, price);

    addChatMessage("left", "Narrator", `You sell ${getItemName(item)} for ${price}g.`, { mode: "narration" });
    renderStats();
    renderTradeOptions(npc);
    saveGameState();
}

    const chatOptions = Array.isArray(options) ? options : getChatOptions(npc);
    queueConversationPrefetch(npc, chatOptions);

        btn.className = `chat-option-btn${option.className ? " " + option.className : ""}`;

function chooseChatOption(option) {
    const choice = typeof option === "string" ? { text: option } : option;
    if (!choice || (!choice.text && !choice.action) || !canConverseWithNPC(G.activeNPC)) return;
    const npc = G.activeNPC;

    if (choice.action === "trade") {
        tradeWithNPC(npc);
        return;
    }

    if (choice.action === "disengage") {
        advanceNPCAffectTime(1);
        advanceStoryTurn(1);
        if (npc && typeof recordNPCConversationChoice === "function") {
            recordNPCConversationChoice(npc, choice);
        }
        if (npc) applyNPCImpact(npc, classifyConversationChoice(npc, choice));
        disengageFromNPC(choice.text);
        return;
    }

    addChatMessage("player", "Narrator", choice.text, { mode: "narration" });
    advanceNPCAffectTime(1);
    advanceStoryTurn(1);
    if (npc && typeof recordNPCConversationChoice === "function") {
        recordNPCConversationChoice(npc, choice);
    }
    if (npc) applyNPCImpact(npc, classifyConversationChoice(npc, choice));
    G.activeNPCMode = "talk";
    setChatOptionsDisabled(true);
    npcRespond(npc, choice);
}

function clearNarration() {
    const el = document.getElementById("narrationEl");
    if (el) el.textContent = "";
}

function setNarration(text) {
    const el = document.getElementById("narrationEl");
    if (el) el.textContent = text || "";
}

function getDirectionLabel(direction) {
    const labels = {
        N: "north",
        S: "south",
        E: "east",
        W: "west",
        NE: "northeast",
        NW: "northwest",
        SE: "southeast",
        SW: "southwest"
    };
    return labels[direction] || String(direction || "").toLowerCase();
}

function lowerFirst(text) {
    const value = String(text || "").trim();
    if (!value) return "";
    return value.charAt(0).toLowerCase() + value.slice(1);
}

function canFlowIntoLocationPhrase(description) {
    return /^(a|an)\s+/i.test(String(description || "").trim());
}

function ensureSentence(text) {
    const value = String(text || "").trim();
    if (!value) return "";
    return /[.!?]$/.test(value) ? value : value + ".";
}

function getEntityName(entity) {
    if (!entity) return "";
    return String(entity.name || entity.displayName || entity.type || entity.id || "").trim();
}

function isVisibleEntity(entity) {
    if (entity && entity.objectType === "body") {
        return !entity.hidden && !entity.isHidden && entity.visible !== false;
    }

    return !!(
        entity &&
        !entity.unconscious &&
        !entity.isUnconsciousBody &&
        !entity.hidden &&
        !entity.isHidden &&
        entity.visible !== false
    );
}

function hasArticle(text) {
    return /^(a|an|the|some|several|many)\s+/i.test(String(text || "").trim());
}

function withIndefiniteArticle(text) {
    const value = String(text || "").trim();
    if (!value || hasArticle(value)) return value;
    if (/s$/i.test(value) && !/ss$/i.test(value)) return value;
    return (/^[aeiou]/i.test(value) ? "an " : "a ") + value;
}

function buildObservationNarration(room) {
    if (!room) return "";

    const lines = [];
    const npcs = Array.isArray(room.creatures)
        ? room.creatures.filter(isVisibleEntity)
        : [];
    const items = Array.isArray(room.items)
        ? room.items.filter(isVisibleEntity)
        : [];

    npcs.forEach(npc => {
        const name = getEntityName(npc);
        if (name) {
            const detail = typeof getNPCObservationDetail === "function"
                ? getNPCObservationDetail(npc) : "";
            lines.push(`You see ${name} here${detail ? ", " + detail : ""}.`);
        }
    });

    items.forEach(item => {
        const name = withIndefiniteArticle(getEntityName(item));
        if (name) lines.push(`You see ${name} here.`);
    });

    return lines.join(" ");
}

function buildRoomEntryNarration(room, mode, direction) {
    const name = room && (room.displayName || room.name || room.type) ? (room.displayName || room.name || room.type) : "this place";
    const description = room && room.baseDescription ? String(room.baseDescription).trim() : "";

    if (!description) {
        if (mode === "move") return `You move ${getDirectionLabel(direction)} into ${name}.`;
        if (mode === "resume") return `Welcome back to ${name}.`;
        return `You find yourself in ${name}.`;
    }

    if (canFlowIntoLocationPhrase(description)) {
        const phrase = lowerFirst(description);
        if (mode === "move") return `You move ${getDirectionLabel(direction)} into ${phrase}`;
        if (mode === "resume") return `You return to ${phrase}`;
        return `You find yourself in ${phrase}`;
    }

    if (mode === "move") return `You move ${getDirectionLabel(direction)}. ${description}`;
    if (mode === "resume") return `You return. ${description}`;
    return `You arrive. ${description}`;
}

function buildRoomNarration(room, mode, direction) {
    const entry = ensureSentence(buildRoomEntryNarration(room, mode, direction));
    const observations = buildObservationNarration(room);
    return observations ? `${entry}\n\n${observations}` : entry;
}

function appendNarrationText(parent, text) {
    parent.appendChild(document.createTextNode(text));
}

function appendNarrationBreak(parent) {
    parent.appendChild(document.createElement("br"));
}

function appendObservationSeparator(parent, hasObservations) {
    if (hasObservations) {
        appendNarrationText(parent, " ");
    } else {
        appendNarrationBreak(parent);
        appendNarrationBreak(parent);
    }
}

function renderRoomObservations(parent, room) {
    if (!parent || !room) return;

    let hasObservations = false;
    const npcs = Array.isArray(room.creatures)
        ? room.creatures.filter(isVisibleEntity)
        : [];
    const items = Array.isArray(room.items)
        ? room.items.filter(isVisibleEntity)
        : [];

    npcs.forEach(npc => {
        const name = getEntityName(npc);
        if (!name) return;

        hydrateNPCSpeciesFlags(npc);
        appendObservationSeparator(parent, hasObservations);
        appendNarrationText(parent, "You see ");

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "narration-entity-btn";
        btn.textContent = name;
        btn.onclick = () => selectNPC(npc);
        parent.appendChild(btn);

        const detail = typeof getNPCObservationDetail === "function"
            ? getNPCObservationDetail(npc) : "";
        appendNarrationText(parent, ` here${detail ? ", " + detail : ""}.`);
        hasObservations = true;
    });

    items.forEach(item => {
        const name = withIndefiniteArticle(getEntityName(item));
        if (!name) return;

        appendObservationSeparator(parent, hasObservations);
        appendNarrationText(parent, "You see ");

        if (isRoomObjectInteractive(item)) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "narration-entity-btn";
            btn.textContent = name;
            btn.onclick = () => selectRoomObject(item);
            parent.appendChild(btn);
        } else {
            appendNarrationText(parent, name);
        }

        appendNarrationText(parent, " here.");
        hasObservations = true;
    });
}

    const el = document.getElementById("narrationEl");

function buildChatTextParts(text, mode = "auto") {
    const source = String(text || "")
        .replace(/[“”]/g, "\"")
        .replace(/[‘’]/g, "'")
        .replace(/\s+/g, " ")
        .trim();

    if (!source) return [];

    if (mode === "narration") {
        return [{ type: "narration", text: source }];
    }

    const quoteCount = (source.match(/"/g) || []).length;
    if (mode === "spoken" && (quoteCount < 2 || quoteCount % 2 !== 0)) {
        return [{ type: "spoken", text: `"${source}"` }];
    }

    if (quoteCount < 2 || quoteCount % 2 !== 0) {
        return [{ type: "plain", text: source }];
    }

    const parts = [];
    let buffer = "";
    let inQuote = false;

    for (let i = 0; i < source.length; i++) {
        const char = source[i];
        if (char === "\"") {
            const cleaned = buffer.trim();
            if (cleaned) {
                parts.push({
                    type: inQuote ? "spoken" : "narration",
                    text: inQuote ? `"${cleaned}"` : cleaned
                });
            }
            buffer = "";
            inQuote = !inQuote;
            continue;
        }
        buffer += char;
    }

    const cleaned = buffer.trim();
    if (cleaned) {
        parts.push({
            type: inQuote ? "spoken" : "narration",
            text: inQuote ? `"${cleaned}"` : cleaned
        });
    }

    if (!parts.some(part => part.type === "spoken")) {
        return [{ type: "plain", text: source }];
    }

    const merged = [];
    for (let i = 0; i < parts.length; i++) {
        const part = parts[i];
        if (!part || !part.text) continue;
        const previous = merged[merged.length - 1];
        if (previous && previous.type === part.type) {
            previous.text += " " + part.text;
        } else {
            merged.push({ type: part.type, text: part.text });
        }
    }

    return merged;
}

function renderChatBubbleText(bubble, side, text, options = {}) {
    if (!bubble) return;

    const mode = options && typeof options.mode === "string" ? options.mode : "auto";
    const parts = buildChatTextParts(text, mode);
    if (!parts.length) {
        bubble.textContent = text || "";
        return;
    }

    const speechClass = side === "player" ? "player-speech" : "npc-speech";
    const voiceClass = side === "player" ? "player-voice" : "npc-voice";

    bubble.textContent = "";
    parts.forEach(part => {
        const span = document.createElement("span");
        const className = part.type === "spoken"
            ? speechClass
            : part.type === "narration"
                ? voiceClass
                : "";
        span.className = `chat-fragment ${className}`.trim();
        span.textContent = part.text;
        bubble.appendChild(span);
    });
}

function isMerchantLikeNPC(npc) {
    const role = String(npc && npc.role || "").toLowerCase();
    return [
        "bartender",
        "innkeeper",
        "shopkeeper",
        "merchant",
        "trader",
        "blacksmith",
        "healer",
        "archivist"
    ].some(tag => role.includes(tag));
}

function shouldShowPostReplyTradeAction(npc) {
    if (!npc || !canConverseWithNPC(npc)) return false;
    if (typeof ensureNPCRelationshipState === "function") ensureNPCRelationshipState(npc);

    const hostility = typeof npc.hostility === "number" ? npc.hostility : 0;
    const favor = npc.memory && typeof npc.memory.favorability === "number" ? npc.memory.favorability : 0;
    if (hostility >= 80 || favor <= -70) return false;

    const hasNpcReply = !!(npc.memory && Array.isArray(npc.memory.recentLines) &&
        npc.memory.recentLines.some(line => line && line.speaker === "npc"));
    const establishedTrader = npc.memory && (npc.memory.tradeCount || 0) > 0;
    return hasNpcReply && (isMerchantLikeNPC(npc) || establishedTrader);
}

    msg.appendChild(bubble);

    log.scrollTop = log.scrollHeight;
}

function renderStats() {

    ensurePlayerEquipmentState(p);

    document.getElementById("hpBarFillEl").style.background =
